  :root{
    --bg-void: #05070a;
    --panel-metal: #14181b;
    --panel-metal-hi: #21272b;
    --panel-metal-lo: #0a0c0e;
    --sign-face: #060a0b;
    --dot-off: #101a1c;
    --text-chrome: #8fa3a8;
    --text-chrome-dim: #52646a;
    --accent-warn: #ff3b3b;
    --led: #2dfdf5;
    --led-glow: rgba(45,253,245,0.55);
    --mono: 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace;
    --radius-sm: 4px;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0; padding:0; min-height:100%;
    background: var(--bg-void);
    background-image:
      radial-gradient(ellipse 900px 500px at 50% 8%, rgba(45,253,245,0.05), transparent 60%),
      repeating-linear-gradient(0deg, rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 1px, transparent 1px, transparent 3px);
    color: var(--text-chrome);
    font-family: var(--mono);
    -webkit-font-smoothing: antialiased;
  }

  .wrap{
    max-width: 880px;
    margin: 0 auto;
    padding: 28px 18px 60px;
  }

  header.top{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:12px;
    margin-bottom: 22px;
    flex-wrap: wrap;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .brand .dot{
    width:8px; height:8px; border-radius:50%;
    background: var(--led);
    box-shadow: 0 0 8px 2px var(--led-glow);
    animation: blink-slow 2.4s ease-in-out infinite;
  }
  .brand h1{
    font-family: 'Nanofon', var(--mono);
    font-weight:400;
    font-size: 22px;
    letter-spacing: 2px;
    margin:0;
    color: #cfe9e8;
    text-shadow: 0 0 10px rgba(45,253,245,0.25);
  }
  .brand .sub{
    font-size:10px;
    letter-spacing:2px;
    color: var(--text-chrome-dim);
    text-transform: uppercase;
  }
  header.top .meta{
    font-size:10px;
    letter-spacing:1.5px;
    color: var(--text-chrome-dim);
    text-transform: uppercase;
    text-align:right;
  }

  /* ---- The sign ---- */
  .sign-stage{
    display:flex;
    justify-content:center;
    padding: 36px 10px 44px;
  }

  .bezel{
    position: relative;
    background:
      linear-gradient(155deg, var(--panel-metal-hi), var(--panel-metal) 40%, var(--panel-metal-lo));
    border-radius: 14px;
    padding: 22px;
    box-shadow:
      0 1px 0 rgba(255,255,255,0.06) inset,
      0 -2px 6px rgba(0,0,0,0.6) inset,
      0 18px 40px rgba(0,0,0,0.55);
    transition: box-shadow 0.4s ease;
  }

  .screw{
    position:absolute;
    width:10px; height:10px;
    border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #3a4247, #0c0f11 70%);
    box-shadow: 0 1px 1px rgba(255,255,255,0.15) inset, 0 1px 2px rgba(0,0,0,0.6);
  }
  .screw::after{
    content:'';
    position:absolute;
    top:50%; left:50%;
    width:6px; height:1.5px;
    background: rgba(0,0,0,0.7);
    transform: translate(-50%,-50%) rotate(38deg);
    box-shadow: 0 0 0 rgba(0,0,0,0.5);
  }
  .screw.tl{ top:9px; left:9px; }
  .screw.tr{ top:9px; right:9px; }
  .screw.bl{ bottom:9px; left:9px; }
  .screw.br{ bottom:9px; right:9px; }

  .glass{
    position:relative;
    overflow:hidden;
    background:
      radial-gradient(circle at 12px 12px, var(--dot-off) 1.1px, transparent 1.3px) 0 0/16px 16px,
      var(--sign-face);
    border-radius: 6px;
    padding: 30px 26px;
    min-width: 260px;
    box-shadow: 0 0 0 1px rgba(0,0,0,0.6) inset, 0 2px 14px rgba(0,0,0,0.7) inset;
  }
  .glass::before{
    /* scanlines */
    content:'';
    position:absolute; inset:0;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,0.22) 0px, rgba(0,0,0,0.22) 1px, transparent 1px, transparent 3px);
    pointer-events:none;
    mix-blend-mode: multiply;
  }

  .marquee-track{
    overflow:hidden;
    width: 100%;
  }
  .sign-lines{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap: 14px;
    width: max-content;
    margin: 0 auto;
  }
  .sign-line{
    font-family: 'Nanofon', var(--mono);
    font-size: 42px;
    line-height: 1.5;
    white-space: pre;
    letter-spacing: 5px;
    color: var(--led);
    text-shadow:
      0 0 2px var(--led),
      0 0 10px var(--led-glow),
      0 0 26px var(--led-glow);
    transition: color 0.3s ease, text-shadow 0.3s ease;
  }
  .sign-line.empty::after{ content: '\00a0'; }

  .sign-lines.scrolling .sign-line{
    display:inline-block;
    animation: marquee linear infinite;
    padding-right: 60px;
  }

  @keyframes marquee{
    from{ transform: translateX(0); }
    to{ transform: translateX(-50%); }
  }

  .sign-lines.blinking .sign-line{
    animation: blink-hard 1s steps(1,end) infinite;
  }

  @keyframes blink-hard{
    0%, 55%{ opacity:1; }
    56%, 100%{ opacity:0.12; }
  }

  .sign-lines.pulsing .sign-line{
    animation: pulse-glow 2.6s ease-in-out infinite;
  }

  @keyframes pulse-glow{
    0%, 100%{ opacity: 1; }
    50%{ opacity: 0.35; }
  }

  .sign-lines.flickering .sign-line{
    animation: neon-flicker 3s linear infinite;
  }

  @keyframes neon-flicker{
    0%, 18%, 22%, 25%, 53%, 57%, 100%{ opacity: 1; }
    20%, 24%, 55%, 56%{ opacity: 0.25; }
    21%{ opacity: 0.6; }
  }

  .sign-line .not-typed{
    opacity: 0;
  }

  .caret::after{
    content: '';
    display: inline-block;
    width: 3px;
    height: 0.9em;
    margin-left: 2px;
    background: currentColor;
    vertical-align: -0.1em;
    animation: cursor-blink 0.9s steps(1,end) infinite;
  }

  @keyframes cursor-blink{
    0%, 50%{ opacity: 1; }
    51%, 100%{ opacity: 0; }
  }

  @keyframes blink-slow{
    0%, 100%{ opacity:1; }
    50%{ opacity:0.35; }
  }

  /* ---- Controls ---- */
  .panel{
    background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0));
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 10px;
    padding: 22px;
  }

  .field{
    display:grid;
    grid-template-columns: 90px 1fr;
    gap: 16px;
    align-items:center;
    padding: 12px 0;
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }
  .field:last-child{ border-bottom:none; }
  .field label{
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-chrome-dim);
  }

  input#msgInput{
    width:100%;
    background: var(--panel-metal-lo);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: var(--radius-sm);
    color: #d7f5f4;
    font-family: var(--mono);
    font-size: 13px;
    padding: 10px 12px;
    outline: none;
    box-sizing: border-box;
  }
  input#msgInput:focus{
    border-color: var(--led);
    box-shadow: 0 0 0 1px var(--led-glow);
  }

  .swatches{
    display:flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items:center;
  }
  .swatch{
    width: 26px; height:26px;
    border-radius:50%;
    border: 2px solid rgba(255,255,255,0.12);
    cursor:pointer;
    position:relative;
    padding:0;
  }
  .swatch.active{
    border-color:#fff;
    box-shadow: 0 0 0 3px rgba(255,255,255,0.08);
  }
  input[type="color"]#customColor{
    width:26px; height:26px;
    border:none; border-radius:50%;
    background:none;
    cursor:pointer;
    padding:0;
  }
  input[type="color"]#customColor::-webkit-color-swatch-wrapper{ padding:0; }
  input[type="color"]#customColor::-webkit-color-swatch{ border-radius:50%; border: 2px solid rgba(255,255,255,0.12); }

  .color-controls{
    display:flex;
    align-items:center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .wheel-toggle{
    width: 26px; height:26px;
    border-radius:50%;
    border: 2px solid rgba(255,255,255,0.12);
    cursor:pointer;
    padding:0;
    background: conic-gradient(from 0deg, #ff3b3b, #ffb000, #f5f560, #39ff6a, #2dfdf5, #3b6bff, #b23bff, #ff3b3b);
    position:relative;
    flex:0 0 auto;
  }
  .wheel-toggle::after{
    content:'';
    position:absolute; inset: 5px;
    border-radius:50%;
    background: radial-gradient(circle, rgba(255,255,255,0.9), rgba(255,255,255,0) 70%);
  }
  .wheel-toggle.active{
    border-color:#fff;
    box-shadow: 0 0 0 3px rgba(255,255,255,0.08);
  }

  .color-wheel-panel{
    position: relative;
    margin-top: 14px;
    padding: 16px;
    border-radius: 8px;
    background: rgba(255,255,255,0.02);
    border: 1px solid rgba(255,255,255,0.06);
    display:flex;
    gap: 20px;
    align-items:center;
    flex-wrap: wrap;
  }
  .color-wheel-panel[hidden]{ display:none; }

  .wheel-close{
    position: absolute;
    top: 8px;
    right: 8px;
    width: 22px; height: 22px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.15);
    background: rgba(255,255,255,0.05);
    color: var(--text-chrome);
    font-size: 12px;
    line-height: 1;
    cursor: pointer;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .wheel-close:hover{
    border-color: var(--led);
    color: var(--led);
  }

  .wheel-wrap{
    position:relative;
    width: 160px; height:160px;
    flex: 0 0 auto;
  }
  .wheel-wrap canvas{
    width:100%; height:100%;
    border-radius:50%;
    display:block;
    cursor: crosshair;
    box-shadow: 0 0 0 1px rgba(255,255,255,0.1), 0 4px 16px rgba(0,0,0,0.5);
  }
  .wheel-cursor{
    position:absolute;
    width:14px; height:14px;
    border-radius:50%;
    border: 2px solid #fff;
    box-shadow: 0 0 0 1px rgba(0,0,0,0.5), 0 0 6px rgba(0,0,0,0.4);
    transform: translate(-50%,-50%);
    pointer-events:none;
  }

  .wheel-side{
    display:flex;
    flex-direction:column;
    gap: 10px;
    flex: 1 1 140px;
    min-width: 140px;
  }
  .wheel-label{
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-chrome-dim);
  }
  input#hexInput{
    background: var(--panel-metal-lo);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: var(--radius-sm);
    color: #d7f5f4;
    font-family: var(--mono);
    font-size: 13px;
    padding: 8px 10px;
    outline: none;
    text-transform: uppercase;
    width: 100%;
  }
  input#hexInput:focus{
    border-color: var(--led);
    box-shadow: 0 0 0 1px var(--led-glow);
  }

  .segmented{
    display:inline-flex;
    flex-wrap: wrap;
    background: var(--panel-metal-lo);
    border-radius: var(--radius-sm);
    padding: 3px;
    gap: 3px;
    border: 1px solid rgba(255,255,255,0.06);
  }
  .segmented button{
    background:none;
    border:none;
    color: var(--text-chrome-dim);
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 6px 12px;
    border-radius: 3px;
    cursor:pointer;
  }
  .segmented button.active{
    background: rgba(45,253,245,0.1);
    color: var(--led);
    box-shadow: 0 0 0 1px rgba(45,253,245,0.3) inset;
  }

  input[type="range"]{
    -webkit-appearance:none;
    width:100%;
    height: 3px;
    background: rgba(255,255,255,0.12);
    border-radius: 2px;
    outline:none;
  }
  input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance:none;
    width: 13px; height:13px;
    border-radius:50%;
    background: var(--led);
    box-shadow: 0 0 6px var(--led-glow);
    cursor:pointer;
    margin-top:-5px;
  }
  input[type="range"]::-moz-range-thumb{
    width: 13px; height:13px;
    border:none;
    border-radius:50%;
    background: var(--led);
    box-shadow: 0 0 6px var(--led-glow);
    cursor:pointer;
  }

  .actions{
    display:flex;
    justify-content:flex-end;
    margin-top: 18px;
    gap: 10px;
  }
  button.dl{
    background: transparent;
    border: 1px solid rgba(45,253,245,0.4);
    color: var(--led);
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    padding: 10px 16px;
    border-radius: var(--radius-sm);
    cursor:pointer;
    transition: background 0.2s ease;
  }
  button.dl:hover{ background: rgba(45,253,245,0.08); }

  footer{
    text-align:center;
    margin-top: 30px;
    font-size: 10px;
    letter-spacing: 1.5px;
    color: var(--text-chrome-dim);
    text-transform: uppercase;
  }

  button, .swatch, .segmented button, input[type="range"]{
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }

  .actions{ flex-wrap: wrap; }
  button.fullscreen-btn{
    background: transparent;
    border: 1px solid rgba(45,253,245,0.4);
    color: var(--led);
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    padding: 10px 16px;
    border-radius: var(--radius-sm);
    cursor:pointer;
    transition: background 0.2s ease;
  }
  button.fullscreen-btn:hover{ background: rgba(45,253,245,0.08); }

  /* ---- Fullscreen LED display ---- */
  .fs-overlay{
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: none;
    align-items: center;
    justify-content: center;
    background: var(--bg-void);
  }
  .fs-overlay.active{ display: flex; }
  /* Rotates the sign 90° so it reads sideways while the phone is held
     upright — the standard trick for "hold up to the camera" LED signs,
     since iOS Safari has no reliable API to force real landscape. */
  .fs-rotor{
    position: absolute;
    top: 50%; left: 50%;
    width: 100vh;
    height: 100vw;
    transform: translate(-50%,-50%) rotate(90deg);
    transform-origin: center center;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .fs-overlay.landscape-native .fs-rotor{
    width: 100vw;
    height: 100vh;
    transform: translate(-50%,-50%);
  }
  /* The .bezel/.glass frame moves into the rotor as-is for fullscreen, so
     it keeps looking like the same physical sign, just scaled up. */
  .fs-rotor .bezel{
    width: 90%;
    max-width: none;
    padding: 3vh 4vh;
    border-radius: 2vh;
    box-sizing: border-box;
  }
  .fs-overlay.landscape-native .fs-rotor .bezel{
    padding: 3vw 4vw;
    border-radius: 2vw;
  }
  .fs-rotor .glass{
    min-width: 0;
    width: 100%;
    padding: 4vh 4vh;
    box-sizing: border-box;
    border-radius: 1.2vh;
  }
  .fs-overlay.landscape-native .fs-rotor .glass{
    padding: 4vw;
    border-radius: 1.2vw;
  }
  .fs-rotor .screw{
    width: 1.4vh; height: 1.4vh;
  }
  .fs-overlay.landscape-native .fs-rotor .screw{
    width: 1.4vw; height: 1.4vw;
  }
  .fs-rotor .screw.tl{ top: 1.2vh; left: 1.2vh; }
  .fs-rotor .screw.tr{ top: 1.2vh; right: 1.2vh; }
  .fs-rotor .screw.bl{ bottom: 1.2vh; left: 1.2vh; }
  .fs-rotor .screw.br{ bottom: 1.2vh; right: 1.2vh; }
  .fs-overlay.landscape-native .fs-rotor .screw.tl{ top: 1.2vw; left: 1.2vw; }
  .fs-overlay.landscape-native .fs-rotor .screw.tr{ top: 1.2vw; right: 1.2vw; }
  .fs-overlay.landscape-native .fs-rotor .screw.bl{ bottom: 1.2vw; left: 1.2vw; }
  .fs-overlay.landscape-native .fs-rotor .screw.br{ bottom: 1.2vw; right: 1.2vw; }
  .fs-rotor .marquee-track{
    overflow:hidden;
    width: 100%;
  }
  .fs-rotor .sign-lines{
    align-items:center;
    gap: 3vw;
    margin: 0 auto;
  }
  .fs-overlay.landscape-native .fs-rotor .sign-lines{
    gap: 3vh;
  }
  .fs-rotor .sign-line{
    font-size: clamp(28px, 12vh, 160px);
  }
  .fs-overlay.landscape-native .fs-rotor .sign-line{
    font-size: clamp(28px, 12vw, 160px);
  }
  .fs-exit{
    position:absolute;
    top: calc(16px + env(safe-area-inset-top));
    right: calc(16px + env(safe-area-inset-right));
    z-index: 2;
    width: 44px; height:44px;
    border-radius:50%;
    border: 1px solid rgba(255,255,255,0.15);
    background: rgba(255,255,255,0.05);
    color: var(--text-chrome);
    font-size: 18px;
    line-height:1;
    cursor:pointer;
  }
  .fs-hint{
    position:absolute;
    bottom: calc(18px + env(safe-area-inset-bottom));
    left:0; right:0;
    text-align:center;
    font-size:10px;
    letter-spacing:2px;
    text-transform:uppercase;
    color: var(--text-chrome-dim);
    pointer-events:none;
  }

  @media (max-width:520px){
    .wrap{ padding: 18px 14px 40px; }
    header.top{ margin-bottom: 16px; }
    .sign-stage{ padding: 22px 6px 30px; }
    .sign-line{ font-size: 26px; }
    .field{ grid-template-columns: 1fr; gap:8px; }
    .panel{ padding:18px 16px; }
    input#msgInput{ font-size:16px; }
    .swatch{ width:34px; height:34px; }
    input[type="color"]#customColor{ width:34px; height:34px; }
    .segmented{ width:100%; }
    .segmented button{ flex:1; padding:11px 10px; font-size:12px; }
    button.dl, button.fullscreen-btn{ flex:1 1 auto; padding:13px 14px; font-size:12px; }
    .fs-exit{ width:46px; height:46px; }
    .wheel-toggle{ width:34px; height:34px; }
    .color-wheel-panel{ padding:14px; gap:16px; }
    .wheel-wrap{ width:140px; height:140px; margin:0 auto; }
  }
</style>
</head>
<body>

<div class="wrap">

  <header class="top">
    <div class="brand">
      <span class="dot"></span>
      <div>
        <h1>NANOFON SIGN SHOP</h1>
        <div class="sub">pixel matrix sign maker</div>
      </div>
    </div>
    <div class="meta">unit&nbsp;07 &middot; on air</div>
  </header>

  <div class="sign-stage">
    <div class="bezel" id="bezel">
      <div class="screw tl"></div>
      <div class="screw tr"></div>
      <div class="screw bl"></div>
      <div class="screw br"></div>
      <div class="glass">
        <div class="marquee-track">
          <div class="sign-lines" id="signLines"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="panel">

    <div class="field">
      <label for="msgInput">Message</label>
      <input type="text" id="msgInput" maxlength="60" spellcheck="false" autocomplete="off" value="HELLO WORLD">
    </div>

    <div class="field">
      <label>Color</label>
      <div>
        <div class="color-controls">
          <div class="swatches" id="swatches">
            <button class="swatch active" data-color="#2dfdf5" style="background:#2dfdf5" title="Cyan"></button>
            <button class="swatch" data-color="#ffb000" style="background:#ffb000" title="Amber"></button>
            <button class="swatch" data-color="#ff3b3b" style="background:#ff3b3b" title="Red"></button>
            <button class="swatch" data-color="#39ff6a" style="background:#39ff6a" title="Green"></button>
            <button class="swatch" data-color="#f5f5f5" style="background:#f5f5f5" title="White"></button>
            <input type="color" id="customColor" value="#2dfdf5" title="Custom">
          </div>
          <button type="button" class="wheel-toggle" id="wheelToggle" title="Color wheel" aria-label="Open color wheel"></button>
        </div>
        <div class="color-wheel-panel" id="colorWheelPanel" hidden>
          <button type="button" class="wheel-close" id="wheelClose" aria-label="Close color wheel">✕</button>
          <div class="wheel-wrap">
            <canvas id="colorWheel" width="160" height="160"></canvas>
            <div class="wheel-cursor" id="wheelCursor"></div>
          </div>
          <div class="wheel-side">
            <div>
              <div class="wheel-label">Brightness</div>
              <input type="range" id="valueRange" min="0" max="100" value="100">
            </div>
            <div>
              <div class="wheel-label">Hex</div>
              <input type="text" id="hexInput" maxlength="7" value="#2DFDF5" spellcheck="false" autocomplete="off">
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="field">
      <label>Mode</label>
      <div class="segmented" id="modeSeg">
        <button data-mode="static" class="active">Static</button>
        <button data-mode="scroll">Scroll</button>
        <button data-mode="blink">Blink</button>
        <button data-mode="pulse">Pulse</button>
        <button data-mode="flicker">Flicker</button>
        <button data-mode="typewriter">Typewriter</button>
      </div>
    </div>

    <div class="field" id="speedField">
      <label>Speed</label>
      <input type="range" id="speedRange" min="4" max="40" value="14">
    </div>

    <div class="field">
      <label>Glow</label>
      <input type="range" id="glowRange" min="0" max="100" value="55">
    </div>

    <div class="actions">
      <button class="fullscreen-btn" id="fullscreenBtn">⛶ Full Screen</button>
      <button class="dl" id="downloadBtn">Download PNG</button>
    </div>
  </div>

  <footer>made with the nanofon typeface</footer>
</div>

<div class="fs-overlay" id="fsOverlay">
  <button class="fs-exit" id="fsExit" aria-label="Exit full screen">✕</button>
  <div class="fs-rotor" id="fsRotor"></div>
  <div class="fs-hint">tap anywhere to exit</div>
</div>

<script>
(function(){
  const msgInput = document.getElementById('msgInput');
  const signLines = document.getElementById('signLines');
  const bezel = document.getElementById('bezel');
  const signStage = document.querySelector('.sign-stage');
  const swatches = document.getElementById('swatches');
  const customColor = document.getElementById('customColor');
  const modeSeg = document.getElementById('modeSeg');
  const speedRange = document.getElementById('speedRange');
  const speedField = document.getElementById('speedField');
  const glowRange = document.getElementById('glowRange');
  const downloadBtn = document.getElementById('downloadBtn');
  const fullscreenBtn = document.getElementById('fullscreenBtn');
  const fsOverlay = document.getElementById('fsOverlay');
  const fsExit = document.getElementById('fsExit');
  const fsRotor = document.getElementById('fsRotor');
  const glass = document.querySelector('.sign-stage .glass');
  const marqueeTrack = document.querySelector('.sign-stage .marquee-track');
  const wheelToggle = document.getElementById('wheelToggle');
  const wheelClose = document.getElementById('wheelClose');
  const colorWheelPanel = document.getElementById('colorWheelPanel');
  const colorWheel = document.getElementById('colorWheel');
  const wheelCursor = document.getElementById('wheelCursor');
  const valueRange = document.getElementById('valueRange');
  const hexInput = document.getElementById('hexInput');
  const wheelCtx = colorWheel.getContext('2d');

  let state = {
    color: '#2dfdf5',
    mode: 'static',
    speed: 14,
    glow: 55
  };

  function hexToRgb(hex){
    const h = hex.replace('#','');
    const bigint = parseInt(h.length===3 ? h.split('').map(c=>c+c).join('') : h, 16);
    return { r:(bigint>>16)&255, g:(bigint>>8)&255, b:bigint&255 };
  }

  function rgbToHex(r,g,b){
    return '#' + [r,g,b].map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');
  }

  function hsvToRgb(h,s,v){
    h = ((h%360)+360)%360;
    const c = v*s;
    const x = c*(1-Math.abs((h/60)%2-1));
    const m = v-c;
    let r=0,g=0,b=0;
    if(h<60){ r=c; g=x; b=0; }
    else if(h<120){ r=x; g=c; b=0; }
    else if(h<180){ r=0; g=c; b=x; }
    else if(h<240){ r=0; g=x; b=c; }
    else if(h<300){ r=x; g=0; b=c; }
    else { r=c; g=0; b=x; }
    return { r:(r+m)*255, g:(g+m)*255, b:(b+m)*255 };
  }

  function rgbToHsv(r,g,b){
    r/=255; g/=255; b/=255;
    const max = Math.max(r,g,b), min = Math.min(r,g,b);
    const d = max-min;
    let h = 0;
    if(d !== 0){
      if(max===r) h = 60*(((g-b)/d)%6);
      else if(max===g) h = 60*((b-r)/d+2);
      else h = 60*((r-g)/d+4);
    }
    if(h<0) h += 360;
    const s = max===0 ? 0 : d/max;
    const v = max;
    return { h, s, v };
  }

  // ---- Adobe-style color wheel: hue = angle, saturation = distance from
  // center, brightness comes from the separate slider ----
  const wheelRadius = colorWheel.width/2;
  let wheelHue = 180, wheelSat = 0.82;

  function drawWheel(){
    const size = colorWheel.width;
    const cx = size/2, cy = size/2;
    const img = wheelCtx.createImageData(size, size);
    const v = valueRange.value/100;
    for(let y=0; y<size; y++){
      for(let x=0; x<size; x++){
        const dx = x-cx, dy = y-cy;
        const dist = Math.sqrt(dx*dx+dy*dy);
        const idx = (y*size+x)*4;
        if(dist <= wheelRadius){
          const angle = Math.atan2(dy,dx) * 180/Math.PI;
          const sat = Math.min(1, dist/wheelRadius);
          const {r,g,b} = hsvToRgb(angle, sat, v);
          img.data[idx] = r; img.data[idx+1] = g; img.data[idx+2] = b; img.data[idx+3] = 255;
        } else {
          img.data[idx+3] = 0;
        }
      }
    }
    wheelCtx.putImageData(img, 0, 0);
  }

  function positionWheelCursor(){
    const size = colorWheel.width;
    const cx = size/2, cy = size/2;
    const rad = wheelHue * Math.PI/180;
    const dist = wheelSat * wheelRadius;
    const x = cx + Math.cos(rad)*dist;
    const y = cy + Math.sin(rad)*dist;
    wheelCursor.style.left = (x/size*100) + '%';
    wheelCursor.style.top = (y/size*100) + '%';
  }

  function setColorFromWheel(){
    const {r,g,b} = hsvToRgb(wheelHue, wheelSat, valueRange.value/100);
    setColor(rgbToHex(r,g,b), 'wheel');
  }

  function syncWheelFromColor(hex){
    const {r,g,b} = hexToRgb(hex);
    const {h,s,v} = rgbToHsv(r,g,b);
    wheelHue = h; wheelSat = s;
    valueRange.value = Math.round(v*100);
    drawWheel();
    positionWheelCursor();
    hexInput.value = hex.toUpperCase();
  }

  function setColor(hex, source){
    state.color = hex;
    customColor.value = hex;
    swatches.querySelectorAll('.swatch').forEach(b=>{
      b.classList.toggle('active', b.dataset.color.toLowerCase() === hex.toLowerCase());
    });
    if(source !== 'wheel') syncWheelFromColor(hex);
    else hexInput.value = hex.toUpperCase();
    applyColor();
  }

  function wheelPointerToHsv(clientX, clientY){
    const rect = colorWheel.getBoundingClientRect();
    const scale = colorWheel.width / rect.width;
    const x = (clientX - rect.left) * scale;
    const y = (clientY - rect.top) * scale;
    const cx = colorWheel.width/2, cy = colorWheel.height/2;
    const dx = x-cx, dy = y-cy;
    const dist = Math.min(wheelRadius, Math.sqrt(dx*dx+dy*dy));
    let angle = Math.atan2(dy,dx) * 180/Math.PI;
    return { hue: angle, sat: dist/wheelRadius };
  }

  let wheelDragging = false;
  function handleWheelPointer(e){
    const point = e.touches ? e.touches[0] : e;
    const { hue, sat } = wheelPointerToHsv(point.clientX, point.clientY);
    wheelHue = hue; wheelSat = sat;
    positionWheelCursor();
    setColorFromWheel();
  }
  colorWheel.addEventListener('pointerdown', (e)=>{
    wheelDragging = true;
    colorWheel.setPointerCapture(e.pointerId);
    handleWheelPointer(e);
  });
  colorWheel.addEventListener('pointermove', (e)=>{
    if(wheelDragging) handleWheelPointer(e);
  });
  colorWheel.addEventListener('pointerup', ()=>{ wheelDragging = false; });
  colorWheel.addEventListener('pointercancel', ()=>{ wheelDragging = false; });

  valueRange.addEventListener('input', ()=>{
    drawWheel();
    setColorFromWheel();
  });

  hexInput.addEventListener('change', ()=>{
    let v = hexInput.value.trim();
    if(!v.startsWith('#')) v = '#'+v;
    if(/^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$/.test(v)){
      if(v.length===4) v = '#'+v[1]+v[1]+v[2]+v[2]+v[3]+v[3];
      setColor(v.toLowerCase());
    } else {
      hexInput.value = state.color.toUpperCase();
    }
  });

  wheelToggle.addEventListener('click', ()=>{
    const opening = colorWheelPanel.hidden;
    colorWheelPanel.hidden = !opening;
    wheelToggle.classList.toggle('active', opening);
    if(opening){ drawWheel(); positionWheelCursor(); }
  });

  wheelClose.addEventListener('click', ()=>{
    colorWheelPanel.hidden = true;
    wheelToggle.classList.remove('active');
  });

  function applyColor(){
    const {r,g,b} = hexToRgb(state.color);
    const glowA = (state.glow/100);
    document.documentElement.style.setProperty('--led', state.color);
    document.documentElement.style.setProperty('--led-glow', `rgba(${r},${g},${b},${(0.15+glowA*0.65).toFixed(2)})`);
    const bezelGlow = 0.15 + glowA*0.4;
    bezel.style.boxShadow = `0 1px 0 rgba(255,255,255,0.06) inset, 0 -2px 6px rgba(0,0,0,0.6) inset, 0 18px 40px rgba(0,0,0,0.55), 0 0 ${40+glowA*70}px rgba(${r},${g},${b},${bezelGlow.toFixed(2)})`;
  }

  let typewriterTimer = null;
  function clearTypewriter(){
    if(typewriterTimer){
      clearInterval(typewriterTimer);
      clearTimeout(typewriterTimer);
      typewriterTimer = null;
    }
  }

  function startTypewriter(lines){
    const divs = lines.map(line=>{
      const div = document.createElement('div');
      div.className = 'sign-line' + (line.trim()==='' ? ' empty' : '');
      if(!line.length){
        div.textContent = '\u00a0';
      } else {
        const shownSpan = document.createElement('span');
        const hiddenSpan = document.createElement('span');
        hiddenSpan.className = 'not-typed';
        hiddenSpan.textContent = line;
        div.appendChild(shownSpan);
        div.appendChild(hiddenSpan);
      }
      signLines.appendChild(div);
      return div;
    });
    const maxLen = Math.max(1, ...lines.map(l=>l.length));
    const stepDelay = Math.max(35, 300 - state.speed*8);
    let i = 0;
    function tick(){
      divs.forEach((div, idx)=>{
        const line = lines[idx];
        if(!line.length) return;
        const shownSpan = div.children[0];
        const hiddenSpan = div.children[1];
        shownSpan.classList.remove('caret');
        shownSpan.textContent = line.slice(0, i);
        hiddenSpan.textContent = line.slice(i);
      });
      if(divs.length && divs[divs.length-1].children[0]){
        divs[divs.length-1].children[0].classList.add('caret');
      }
      i++;
      if(i > maxLen){
        clearTypewriter();
        typewriterTimer = setTimeout(()=>{ i = 0; typewriterTimer = setInterval(tick, stepDelay); }, 1100);
      }
    }
    typewriterTimer = setInterval(tick, stepDelay);
  }

  function render(){
    const lines = msgInput.value.split('\n').slice(0,4);
    clearTypewriter();
    signLines.innerHTML = '';
    signLines.classList.toggle('scrolling', state.mode==='scroll');
    signLines.classList.toggle('blinking', state.mode==='blink');
    signLines.classList.toggle('pulsing', state.mode==='pulse');
    signLines.classList.toggle('flickering', state.mode==='flicker');

    if(state.mode === 'typewriter'){
      startTypewriter(lines);
    } else {
      lines.forEach(line=>{
        const div = document.createElement('div');
        div.className = 'sign-line' + (line.trim()==='' ? ' empty' : '');
        if(state.mode === 'scroll'){
          const text = line.length ? line : '\u00a0';
          div.textContent = (text + '\u00a0\u00a0\u00a0\u00a0\u00a0') .repeat(2);
          div.style.animationDuration = (Math.max(2, (44 - state.speed)) ) + 's';
        } else {
          div.textContent = line.length ? line : '\u00a0';
        }
        signLines.appendChild(div);
      });
    }

    const speedActive = state.mode === 'scroll' || state.mode === 'typewriter';
    speedField.style.opacity = speedActive ? '1' : '0.35';
    speedRange.disabled = !speedActive;
  }

  msgInput.addEventListener('input', render);

  swatches.querySelectorAll('.swatch').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      setColor(btn.dataset.color);
    });
  });

  customColor.addEventListener('input', ()=>{
    setColor(customColor.value);
  });

  modeSeg.querySelectorAll('button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      modeSeg.querySelectorAll('button').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      state.mode = btn.dataset.mode;
      render();
    });
  });

  speedRange.addEventListener('input', ()=>{
    state.speed = parseInt(speedRange.value,10);
    render();
  });

  glowRange.addEventListener('input', ()=>{
    state.glow = parseInt(glowRange.value,10);
    applyColor();
  });

  downloadBtn.addEventListener('click', ()=>{
    const lines = msgInput.value.split('\n').slice(0,4).filter(l=>true);
    const scale = 4;
    const fontSize = 42 * scale;
    const padX = 60*scale, padY = 40*scale;
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    ctx.font = fontSize + 'px Nanofon';
    let maxW = 0;
    lines.forEach(l=>{
      const w = ctx.measureText(l.length?l:' ').width;
      if(w>maxW) maxW = w;
    });
    const lineH = fontSize*1.25;
    canvas.width = Math.max(400, maxW + padX*2);
    canvas.height = lines.length*lineH + padY*2;

    ctx.fillStyle = '#060a0b';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.font = fontSize + 'px Nanofon';
    ctx.textBaseline = 'top';
    ctx.fillStyle = state.color;
    ctx.shadowColor = state.color;
    ctx.shadowBlur = 20 + (state.glow/100)*40;
    lines.forEach((l,i)=>{
      ctx.fillText(l.length?l:' ', padX, padY + i*lineH);
    });

    const link = document.createElement('a');
    link.download = 'nanofon-sign.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  });

  function updateOrientationClass(){
    // If the device is already physically in landscape (e.g. Android
    // granted a real orientation lock, or the user manually rotated with
    // auto-rotate on), don't also apply the CSS rotation on top of it.
    const isLandscape = window.matchMedia('(orientation: landscape)').matches;
    fsOverlay.classList.toggle('landscape-native', isLandscape);
  }

  function enterFullscreen(){
    fsRotor.appendChild(bezel);
    fsOverlay.classList.add('active');
    document.body.style.overflow = 'hidden';
    updateOrientationClass();
    const el = fsOverlay;
    try{
      const req = el.requestFullscreen || el.webkitRequestFullscreen;
      if(req){
        const p = req.call(el);
        const tryLock = ()=>{
          if(screen.orientation && screen.orientation.lock){
            screen.orientation.lock('landscape').catch(()=>{});
          }
        };
        if(p && p.then) p.then(tryLock).catch(()=>{});
        else tryLock();
      }
    } catch(err){ /* fullscreen not available, CSS rotation still covers the screen */ }
  }

  function exitFullscreen(){
    signStage.appendChild(bezel);
    fsOverlay.classList.remove('active');
    document.body.style.overflow = '';
    try{
      if(screen.orientation && screen.orientation.unlock) screen.orientation.unlock();
    } catch(err){ /* ignore */ }
    try{
      if(document.fullscreenElement || document.webkitFullscreenElement){
        const exit = document.exitFullscreen || document.webkitExitFullscreen;
        if(exit){
          const p = exit.call(document);
          if(p && p.catch) p.catch(()=>{});
        }
      }
    } catch(err){ /* ignore */ }
  }

  window.addEventListener('resize', ()=>{
    if(fsOverlay.classList.contains('active')) updateOrientationClass();
  });

  fullscreenBtn.addEventListener('click', enterFullscreen);
  fsExit.addEventListener('click', exitFullscreen);
  fsOverlay.addEventListener('click', (e)=>{
    if(e.target === fsOverlay) exitFullscreen();
  });
  document.addEventListener('keydown', (e)=>{
    if(e.key === 'Escape' && fsOverlay.classList.contains('active')) exitFullscreen();
  });
  document.addEventListener('fullscreenchange', ()=>{
    if(!document.fullscreenElement && fsOverlay.classList.contains('active')) exitFullscreen();
  });
  document.addEventListener('webkitfullscreenchange', ()=>{
    if(!document.webkitFullscreenElement && fsOverlay.classList.contains('active')) exitFullscreen();
  });

  applyColor();
  render();
  syncWheelFromColor(state.color);
})();
</script>

</body>
</html>
