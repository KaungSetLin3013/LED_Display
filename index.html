<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.ico" sizes="48x48">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#05070a">
<title>Nanofon — LED Sign Shop</title>
<style>
  @font-face {
    font-family: 'Nanofon';
    /* >>> REPLACE THIS WHOLE src LINE WITH YOUR EXISTING BASE64 src LINE <<< */
    src: url('data:font/ttf;base64,PASTE_YOUR_EXISTING_BASE64_FONT_DATA_HERE') format('truetype');
    font-display: swap;
  }

  :root{
    --bg-void: #05070a;
    --panel-metal: #14181b;
    --panel-metal-hi: #21272b;
    --panel-metal-lo: #0a0c0e;
    --sign-face: #060a0b;
    --dot-off: #101a1c;
    --text-chrome: #8fa3a8;
    --text-chrome-dim: #52646a;
    --accent-warn: #ff3b3b;
    --led: #2dfdf5;
    --led-glow: rgba(45,253,245,0.55);
    --led-dim: rgba(45,253,245,0.5);
    --mono: 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace;
    --radius-sm: 4px;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0; padding:0; min-height:100%;
    background: var(--bg-void);
    background-image:
      radial-gradient(ellipse 900px 500px at 50% 8%, rgba(45,253,245,0.05), transparent 60%),
      repeating-linear-gradient(0deg, rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 1px, transparent 1px, transparent 3px);
    color: var(--text-chrome);
    font-family: var(--mono);
    -webkit-font-smoothing: antialiased;
  }

  .wrap{
    max-width: 880px;
    margin: 0 auto;
    padding: 28px 18px 60px;
  }

  header.top{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:12px;
    margin-bottom: 22px;
    flex-wrap: wrap;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .brand .dot{
    width:8px; height:8px; border-radius:50%;
    background: var(--led);
    box-shadow: 0 0 8px 2px var(--led-glow);
    animation: blink-slow 2.4s ease-in-out infinite;
  }
  .brand h1{
    font-family: 'Nanofon', var(--mono);
    font-weight:400;
    font-size: 22px;
    letter-spacing: 2px;
    margin:0;
    color: #cfe9e8;
    text-shadow: 0 0 10px rgba(45,253,245,0.25);
  }
  .brand .sub{
    font-size:10px;
    letter-spacing:2px;
    color: var(--text-chrome-dim);
    text-transform: uppercase;
  }
  header.top .meta{
    font-size:10px;
    letter-spacing:1.5px;
    color: var(--text-chrome-dim);
    text-transform: uppercase;
    text-align:right;
  }

  /* ---- The sign ---- */
  .sign-stage{
    display:flex;
    justify-content:center;
    padding: 36px 10px 44px;
  }

  .bezel{
    position: relative;
    width: 100%;
    max-width: 640px;
    background:
      linear-gradient(155deg, var(--panel-metal-hi), var(--panel-metal) 40%, var(--panel-metal-lo));
    border-radius: 14px;
    padding: 22px;
    box-shadow:
      0 1px 0 rgba(255,255,255,0.06) inset,
      0 -2px 6px rgba(0,0,0,0.6) inset,
      0 18px 40px rgba(0,0,0,0.55);
    transition: box-shadow 0.4s ease;
  }

  .screw{
    position:absolute;
    width:10px; height:10px;
    border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #3a4247, #0c0f11 70%);
    box-shadow: 0 1px 1px rgba(255,255,255,0.15) inset, 0 1px 2px rgba(0,0,0,0.6);
  }
  .screw::after{
    content:'';
    position:absolute;
    top:50%; left:50%;
    width:6px; height:1.5px;
    background: rgba(0,0,0,0.7);
    transform: translate(-50%,-50%) rotate(38deg);
    box-shadow: 0 0 0 rgba(0,0,0,0.5);
  }
  .screw.tl{ top:9px; left:9px; }
  .screw.tr{ top:9px; right:9px; }
  .screw.bl{ bottom:9px; left:9px; }
  .screw.br{ bottom:9px; right:9px; }

  .glass{
    position:relative;
    overflow:hidden;
    background:
      radial-gradient(circle at 12px 12px, var(--dot-off) 1.1px, transparent 1.3px) 0 0/16px 16px,
      var(--sign-face);
    border-radius: 6px;
    padding: 30px 26px;
    width: 100%;
    box-shadow: 0 0 0 1px rgba(0,0,0,0.6) inset, 0 2px 14px rgba(0,0,0,0.7) inset;
  }
  .glass::before{
    content:'';
    position:absolute; inset:0;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,0.22) 0px, rgba(0,0,0,0.22) 1px, transparent 1px, transparent 3px);
    pointer-events:none;
    mix-blend-mode: multiply;
  }

  .marquee-track{
    overflow:hidden;
    width: 100%;
  }
  .sign-lines{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap: 14px;
    width: max-content;
    margin: 0 auto;
  }
  .sign-line{
    font-family: var(--sign-font, 'Nanofon'), var(--mono);
    font-size: 42px;
    line-height: 1.5;
    white-space: pre;
    letter-spacing: 5px;
    color: var(--led);
    text-shadow:
      0 0 2px var(--led),
      0 0 10px var(--led-glow),
      0 0 26px var(--led-glow);
    transition: color 0.3s ease, text-shadow 0.3s ease;
  }
  .sign-line.empty::after{ content: '\00a0'; }

  .sign-lines.scrolling .sign-line{
    display:inline-block;
    animation: marquee linear infinite;
    padding-right: 60px;
  }

  @keyframes marquee{
    from{ transform: translateX(0); }
    to{ transform: translateX(-50%); }
  }

  .sign-lines.blinking .sign-line{
    animation: blink-hard 1s steps(1,end) infinite;
  }

  @keyframes blink-hard{
    0%, 55%{ opacity:1; }
    56%, 100%{ opacity:0.12; }
  }

  .sign-lines.pulsing .sign-line{
    animation: pulse-glow 2.6s ease-in-out infinite;
  }

  @keyframes pulse-glow{
    0%, 100%{ opacity: 1; }
    50%{ opacity: 0.35; }
  }

  .sign-lines.flickering .sign-line{
    animation: neon-flicker 3s linear infinite;
  }

  @keyframes neon-flicker{
    0%, 18%, 22%, 25%, 53%, 57%, 100%{ opacity: 1; }
    20%, 24%, 55%, 56%{ opacity: 0.25; }
    21%{ opacity: 0.6; }
  }

  .sign-line .not-typed{
    opacity: 0;
  }

  .caret::after{
    content: '';
    display: inline-block;
    width: 3px;
    height: 0.9em;
    margin-left: 2px;
    background: currentColor;
    vertical-align: -0.1em;
    animation: cursor-blink 0.9s steps(1,end) infinite;
  }

  @keyframes cursor-blink{
    0%, 50%{ opacity: 1; }
    51%, 100%{ opacity: 0; }
  }

  /* ---- Neo Sign ---- */
  .glass.neon-active::after{
    content:'';
    position:absolute;
    inset:0;
    background: repeating-linear-gradient(
      0deg,
      rgba(0,0,0,0.25) 0px,
      rgba(0,0,0,0.25) 1px,
      transparent 1px,
      transparent 3px
    );
    mix-blend-mode: multiply;
    pointer-events:none;
    animation: scanline-drift 6s linear infinite;
  }
  @keyframes scanline-drift{
    from{ background-position: 0 0; }
    to{ background-position: 0 12px; }
  }

  .sign-lines.neon-mode .sign-line{
    color: var(--led-dim);
    -webkit-text-stroke: 1.5px var(--led);
    text-stroke: 1.5px var(--led);
    text-shadow:
      0 0 2px var(--led),
      0 0 12px var(--led-glow),
      0 0 34px var(--led-glow),
      0 0 70px var(--led-glow);
  }
  .sign-lines.neon-mode .sign-line:not(.empty){
    position: relative;
  }
  .sign-lines.neon-mode .sign-line:not(.empty)::before,
  .sign-lines.neon-mode .sign-line:not(.empty)::after{
    content: attr(data-text);
    position: absolute;
    left:0; top:0;
    width:100%;
    pointer-events:none;
    opacity:0;
  }
  .sign-lines.neon-mode .sign-line:not(.empty)::before{
    color:#ff2bd6;
    animation: glitch-split-1 5s infinite steps(1,end);
  }
  .sign-lines.neon-mode .sign-line:not(.empty)::after{
    color:#2bfff0;
    animation: glitch-split-2 5s infinite steps(1,end);
  }
  @keyframes glitch-split-1{
    0%, 91%, 100%{ opacity:0; transform:translate(0,0); clip-path: inset(0 0 0 0); }
    92%{ opacity:0.75; transform:translate(-2px,0); clip-path: inset(15% 0 55% 0); }
    93%{ opacity:0.6; transform:translate(1px,0); clip-path: inset(55% 0 10% 0); }
    94%{ opacity:0; transform:translate(0,0); }
  }
  @keyframes glitch-split-2{
    0%, 89%, 100%{ opacity:0; transform:translate(0,0); clip-path: inset(0 0 0 0); }
    90%{ opacity:0.7; transform:translate(2px,0); clip-path: inset(40% 0 25% 0); }
    91%{ opacity:0.55; transform:translate(-1px,0); clip-path: inset(10% 0 60% 0); }
    92%{ opacity:0; transform:translate(0,0); }
  }

  @keyframes blink-slow{
    0%, 100%{ opacity:1; }
    50%{ opacity:0.35; }
  }

  /* ---- Controls ---- */
  .panel{
    background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0));
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 10px;
    padding: 22px;
  }

  .field{
    display:grid;
    grid-template-columns: 90px 1fr;
    gap: 16px;
    align-items:center;
    padding: 12px 0;
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }
  .field:last-child{ border-bottom:none; }
  .field[hidden], .opt-group[hidden]{ display:none; }
  .field label{
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-chrome-dim);
  }

  input#msgInput{
    width:100%;
    background: var(--panel-metal-lo);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: var(--radius-sm);
    color: #d7f5f4;
    font-family: var(--mono);
    font-size: 13px;
    padding: 10px 12px;
    outline: none;
    box-sizing: border-box;
  }
  input#msgInput:focus{
    border-color: var(--led);
    box-shadow: 0 0 0 1px var(--led-glow);
  }

  .swatches{
    display:flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items:center;
  }
  .swatch{
    width: 26px; height:26px;
    border-radius:50%;
    border: 2px solid rgba(255,255,255,0.12);
    cursor:pointer;
    position:relative;
    padding:0;
  }
  .swatch.active{
    border-color:#fff;
    box-shadow: 0 0 0 3px rgba(255,255,255,0.08);
  }
  input[type="color"]#customColor{
    width:26px; height:26px;
    border:none; border-radius:50%;
    background:none;
    cursor:pointer;
    padding:0;
  }
  input[type="color"]#customColor::-webkit-color-swatch-wrapper{ padding:0; }
  input[type="color"]#customColor::-webkit-color-swatch{ border-radius:50%; border: 2px solid rgba(255,255,255,0.12); }

  .color-controls{
    display:flex;
    align-items:center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .wheel-toggle{
    width: 26px; height:26px;
    border-radius:50%;
    border: 2px solid rgba(255,255,255,0.12);
    cursor:pointer;
    padding:0;
    background: conic-gradient(from 0deg, #ff3b3b, #ffb000, #f5f560, #39ff6a, #2dfdf5, #3b6bff, #b23bff, #ff3b3b);
    position:relative;
    flex:0 0 auto;
  }
  .wheel-toggle::after{
    content:'';
    position:absolute; inset: 5px;
    border-radius:50%;
    background: radial-gradient(circle, rgba(255,255,255,0.9), rgba(255,255,255,0) 70%);
  }
  .wheel-toggle.active{
    border-color:#fff;
    box-shadow: 0 0 0 3px rgba(255,255,255,0.08);
  }

  .color-wheel-panel{
    position: relative;
    margin-top: 14px;
    padding: 16px;
    border-radius: 8px;
    background: rgba(255,255,255,0.02);
    border: 1px solid rgba(255,255,255,0.06);
    display:flex;
    gap: 20px;
    align-items:center;
    flex-wrap: wrap;
  }
  .color-wheel-panel[hidden]{ display:none; }

  .wheel-close{
    position: absolute;
    top: 8px;
    right: 8px;
    width: 22px; height: 22px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.15);
    background: rgba(255,255,255,0.05);
    color: var(--text-chrome);
    font-size: 12px;
    line-height: 1;
    cursor: pointer;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .wheel-close:hover{
    border-color: var(--led);
    color: var(--led);
  }

  .wheel-wrap{
    position:relative;
    width: 160px; height:160px;
    flex: 0 0 auto;
  }
  .wheel-wrap canvas{
    width:100%; height:100%;
    border-radius:50%;
    display:block;
    cursor: crosshair;
    box-shadow: 0 0 0 1px rgba(255,255,255,0.1), 0 4px 16px rgba(0,0,0,0.5);
  }
  .wheel-cursor{
    position:absolute;
    width:14px; height:14px;
    border-radius:50%;
    border: 2px solid #fff;
    box-shadow: 0 0 0 1px rgba(0,0,0,0.5), 0 0 6px rgba(0,0,0,0.4);
    transform: translate(-50%,-50%);
    pointer-events:none;
  }

  .wheel-side{
    display:flex;
    flex-direction:column;
    gap: 10px;
    flex: 1 1 140px;
    min-width: 140px;
  }
  .wheel-label{
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-chrome-dim);
  }
  input#hexInput{
    background: var(--panel-metal-lo);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: var(--radius-sm);
    color: #d7f5f4;
    font-family: var(--mono);
    font-size: 13px;
    padding: 8px 10px;
    outline: none;
    text-transform: uppercase;
    width: 100%;
  }
  input#hexInput:focus{
    border-color: var(--led);
    box-shadow: 0 0 0 1px var(--led-glow);
  }

  select#fontSelect{
    width: 100%;
    background: var(--panel-metal-lo);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: var(--radius-sm);
    color: #d7f5f4;
    font-family: var(--mono);
    font-size: 13px;
    padding: 10px 12px;
    outline: none;
    cursor: pointer;
    appearance: none;
    -webkit-appearance: none;
    background-image: linear-gradient(45deg, transparent 50%, var(--text-chrome-dim) 50%), linear-gradient(135deg, var(--text-chrome-dim) 50%, transparent 50%);
    background-position: calc(100% - 18px) center, calc(100% - 13px) center;
    background-size: 5px 5px, 5px 5px;
    background-repeat: no-repeat;
  }
  select#fontSelect:focus{
    border-color: var(--led);
    box-shadow: 0 0 0 1px var(--led-glow);
  }
  select#fontSelect option{
    background: var(--panel-metal-lo);
    color: #d7f5f4;
  }

  .segmented{
    display:inline-flex;
    flex-wrap: wrap;
    background: var(--panel-metal-lo);
    border-radius: var(--radius-sm);
    padding: 3px;
    gap: 3px;
    border: 1px solid rgba(255,255,255,0.06);
  }
  .segmented button{
    background:none;
    border:none;
    color: var(--text-chrome-dim);
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 6px 12px;
    border-radius: 3px;
    cursor:pointer;
  }
  .segmented button.active{
    background: rgba(45,253,245,0.1);
    color: var(--led);
    box-shadow: 0 0 0 1px rgba(45,253,245,0.3) inset;
  }

  /* ---- Source options (clock / weather / countdown) ---- */
  .opt-group{ display:flex; flex-wrap:wrap; align-items:center; gap:10px; }
  .opt-group + .opt-group{ margin-top:10px; }
  input.txt, input.dt{
    background: var(--panel-metal-lo);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: var(--radius-sm);
    color: #d7f5f4;
    font-family: var(--mono);
    font-size: 13px;
    padding: 9px 10px;
    outline: none;
    min-width: 0;
    flex: 1 1 140px;
    color-scheme: dark;
  }
  input.txt:focus, input.dt:focus{ border-color: var(--led); box-shadow: 0 0 0 1px var(--led-glow); }
  .mini-btn{
    background: transparent;
    border: 1px solid rgba(45,253,245,0.4);
    color: var(--led);
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 9px 12px;
    border-radius: var(--radius-sm);
    cursor: pointer;
  }
  .mini-btn:hover{ background: rgba(45,253,245,0.08); }
  .check{ display:flex; align-items:center; gap:6px; cursor:pointer; }
  .check input{ accent-color: var(--led); }

  input[type="range"]{
    -webkit-appearance:none;
    width:100%;
    height: 3px;
    background: rgba(255,255,255,0.12);
    border-radius: 2px;
    outline:none;
  }
  input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance:none;
    width: 13px; height:13px;
    border-radius:50%;
    background: var(--led);
    box-shadow: 0 0 6px var(--led-glow);
    cursor:pointer;
    margin-top:-5px;
  }
  input[type="range"]::-moz-range-thumb{
    width: 13px; height:13px;
    border:none;
    border-radius:50%;
    background: var(--led);
    box-shadow: 0 0 6px var(--led-glow);
    cursor:pointer;
  }

  .actions{
    display:flex;
    justify-content:flex-end;
    margin-top: 18px;
    gap: 10px;
    flex-wrap: wrap;
  }
  button.dl{
    background: transparent;
    border: 1px solid rgba(45,253,245,0.4);
    color: var(--led);
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    padding: 10px 16px;
    border-radius: var(--radius-sm);
    cursor:pointer;
    transition: background 0.2s ease;
  }
  button.dl:hover{ background: rgba(45,253,245,0.08); }

  footer{
    text-align:center;
    margin-top: 30px;
    font-size: 10px;
    letter-spacing: 1.5px;
    color: var(--text-chrome-dim);
    text-transform: uppercase;
  }

  button, .swatch, .segmented button, input[type="range"]{
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }

  button.fullscreen-btn{
    background: transparent;
    border: 1px solid rgba(45,253,245,0.4);
    color: var(--led);
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    padding: 10px 16px;
    border-radius: var(--radius-sm);
    cursor:pointer;
    transition: background 0.2s ease;
  }
  button.fullscreen-btn:hover{ background: rgba(45,253,245,0.08); }

  /* ---- Fullscreen LED display ---- */
  .fs-overlay{
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: none;
    align-items: center;
    justify-content: center;
    background: var(--bg-void);
  }
  .fs-overlay.active{ display: flex; }
  .fs-rotor{
    position: absolute;
    top: 50%; left: 50%;
    width: 100vh;
    height: 100vw;
    transform: translate(-50%,-50%) rotate(90deg);
    transform-origin: center center;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .fs-overlay.landscape-native .fs-rotor{
    width: 100vw;
    height: 100vh;
    transform: translate(-50%,-50%);
  }
  .fs-rotor .bezel{
    width: 90%;
    max-width: none;
    padding: 3vh 4vh;
    border-radius: 2vh;
    box-sizing: border-box;
  }
  .fs-overlay.landscape-native .fs-rotor .bezel{
    padding: 3vw 4vw;
    border-radius: 2vw;
  }
  .fs-rotor .glass{
    min-width: 0;
    width: 100%;
    padding: 4vh 4vh;
    box-sizing: border-box;
    border-radius: 1.2vh;
  }
  .fs-overlay.landscape-native .fs-rotor .glass{
    padding: 4vw;
    border-radius: 1.2vw;
  }
  .fs-rotor .screw{
    width: 1.4vh; height: 1.4vh;
  }
  .fs-overlay.landscape-native .fs-rotor .screw{
    width: 1.4vw; height: 1.4vw;
  }
  .fs-rotor .screw.tl{ top: 1.2vh; left: 1.2vh; }
  .fs-rotor .screw.tr{ top: 1.2vh; right: 1.2vh; }
  .fs-rotor .screw.bl{ bottom: 1.2vh; left: 1.2vh; }
  .fs-rotor .screw.br{ bottom: 1.2vh; right: 1.2vh; }
  .fs-overlay.landscape-native .fs-rotor .screw.tl{ top: 1.2vw; left: 1.2vw; }
  .fs-overlay.landscape-native .fs-rotor .screw.tr{ top: 1.2vw; right: 1.2vw; }
  .fs-overlay.landscape-native .fs-rotor .screw.bl{ bottom: 1.2vw; left: 1.2vw; }
  .fs-overlay.landscape-native .fs-rotor .screw.br{ bottom: 1.2vw; right: 1.2vw; }
  .fs-rotor .marquee-track{
    overflow:hidden;
    width: 100%;
  }
  .fs-rotor .sign-lines{
    align-items:center;
    gap: 3vw;
    margin: 0 auto;
  }
  .fs-overlay.landscape-native .fs-rotor .sign-lines{
    gap: 3vh;
  }

  /* Full screen text size — multiplied by --fs-scale (1 = default) */
  .fs-rotor .sign-line{
    font-size: calc(clamp(28px, 12vh, 160px) * var(--fs-scale, 1));
  }
  .fs-overlay.landscape-native .fs-rotor .sign-line{
    font-size: calc(clamp(28px, 12vw, 160px) * var(--fs-scale, 1));
  }

  .fs-exit{
    position:absolute;
    top: calc(16px + env(safe-area-inset-top));
    right: calc(16px + env(safe-area-inset-right));
    z-index: 2;
    width: 44px; height:44px;
    border-radius:50%;
    border: 1px solid rgba(255,255,255,0.15);
    background: rgba(255,255,255,0.05);
    color: var(--text-chrome);
    font-size: 18px;
    line-height:1;
    cursor:pointer;
  }
  .fs-hint{
    position:absolute;
    bottom: calc(18px + env(safe-area-inset-bottom));
    left:0; right:0;
    text-align:center;
    font-size:10px;
    letter-spacing:2px;
    text-transform:uppercase;
    color: var(--text-chrome-dim);
    pointer-events:none;
  }

  /* Full screen size controls (A- / slider / A+ / exit) */
  .fs-controls{
    position:absolute;
    left:50%;
    bottom: calc(18px + env(safe-area-inset-bottom));
    transform: translateX(-50%);
    z-index: 5;
    display:flex;
    align-items:center;
    gap:12px;
    padding:10px 14px;
    background: rgba(10,12,14,0.85);
    border:1px solid rgba(255,255,255,0.12);
    border-radius: 999px;
    opacity:0;
    pointer-events:none;
    transition: opacity 0.25s ease;
  }
  .fs-controls.show{ opacity:1; pointer-events:auto; }
  .fs-controls button{
    background:none;
    border:1px solid rgba(255,255,255,0.2);
    color: var(--text-chrome);
    font-family: var(--mono);
    font-size:13px;
    min-width:38px; height:38px;
    border-radius:50%;
    cursor:pointer;
  }
  .fs-controls button:hover{ border-color:var(--led); color:var(--led); }
  .fs-controls input[type="range"]{ width: 160px; }

  @media (max-width:520px){
    .wrap{ padding: 18px 14px 40px; }
    header.top{ margin-bottom: 16px; }
    .sign-stage{ padding: 22px 6px 30px; }
    .sign-line{ font-size: 26px; }
    .field{ grid-template-columns: 1fr; gap:8px; }
    .panel{ padding:18px 16px; }
    input#msgInput{ font-size:16px; }
    .swatch{ width:34px; height:34px; }
    input[type="color"]#customColor{ width:34px; height:34px; }
    .segmented{ width:100%; }
    .segmented button{ flex:1; padding:11px 10px; font-size:12px; }
    button.dl, button.fullscreen-btn{ flex:1 1 auto; padding:13px 14px; font-size:12px; }
    .fs-exit{ width:46px; height:46px; }
    .wheel-toggle{ width:34px; height:34px; }
    .color-wheel-panel{ padding:14px; gap:16px; }
    .wheel-wrap{ width:140px; height:140px; margin:0 auto; }
    .fs-controls input[type="range"]{ width: 110px; }
  }

  /* ---- Phone full screen: show ONLY the signboard ---- */
  @media (pointer: coarse), (max-width: 820px){
    .fs-overlay.active .fs-rotor .bezel{
      width: 100%;
      height: 100%;
      padding: 0;
      border-radius: 0;
      background: none;
      box-shadow: none !important;
    }
    .fs-overlay.active .fs-rotor .screw{ display: none; }
    .fs-overlay.active .fs-rotor .glass{
      height: 100%;
      border-radius: 0;
      box-shadow: none;
      padding: 4vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .fs-overlay.landscape-native.active .fs-rotor .glass{ padding: 4vw; }
    .fs-overlay.active .fs-exit,
    .fs-overlay.active .fs-hint{ display: none; }
  }

  /* ---- PC full screen: no rotation; sign fills the whole screen ---- */
  .fs-overlay.active.pc-mode .fs-rotor .bezel{
    width: 100%;
    height: 100%;
    padding: 2vmin;
    border-radius: 0;
  }
  .fs-overlay.active.pc-mode .fs-rotor .glass{
    height: 100%;
    padding: 4vmin;
    border-radius: 1vmin;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ---- Full screen border (keep LAST so it overrides the rules above) ---- */
  .fs-overlay.active .fs-rotor .glass{
    border: 0.8vmin solid var(--led);
    box-shadow: 0 0 2.5vmin var(--led-glow), inset 0 0 2.5vmin var(--led-glow);
  }
</style>
</head>
<body>

<div class="wrap">

  <header class="top">
    <div class="brand">
      <span class="dot"></span>
      <div>
        <h1>NANOFON SIGN SHOP</h1>
        <div class="sub">pixel matrix sign maker</div>
      </div>
    </div>
    <div class="meta">unit&nbsp;07 &middot; on air</div>
  </header>

  <div class="sign-stage">
    <div class="bezel" id="bezel">
      <div class="screw tl"></div>
      <div class="screw tr"></div>
      <div class="screw bl"></div>
      <div class="screw br"></div>
      <div class="glass">
        <div class="marquee-track">
          <div class="sign-lines" id="signLines"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="panel">

    <div class="field">
      <label for="msgInput">Message</label>
      <input type="text" id="msgInput" maxlength="60" spellcheck="false" autocomplete="off" value="HELLO WORLD">
    </div>

    <div class="field">
      <label>Source</label>
      <div class="segmented" id="sourceSeg">
        <button data-source="text" class="active">Text</button>
        <button data-source="clock">Clock</button>
        <button data-source="date">Date</button>
        <button data-source="weather">Weather</button>
        <button data-source="countdown">Countdown</button>
      </div>
    </div>

    <div class="field" id="optionsField" hidden>
      <label>Options</label>
      <div>
        <div class="opt-group" data-for="clock" hidden>
          <div class="segmented" id="hourSeg">
            <button data-h="24" class="active">24H</button>
            <button data-h="12">12H</button>
          </div>
          <label class="check"><input type="checkbox" id="secToggle" checked> Seconds</label>
        </div>

        <div class="opt-group" data-for="weather" hidden>
          <input type="text" class="txt" id="cityInput" value="Tokyo" placeholder="City" spellcheck="false" autocomplete="off">
          <button type="button" class="mini-btn" id="cityGo">Go</button>
          <button type="button" class="mini-btn" id="geoBtn">My location</button>
          <div class="segmented" id="unitSeg">
            <button data-u="C" class="active">°C</button>
            <button data-u="F">°F</button>
          </div>
        </div>

        <div class="opt-group" data-for="countdown" hidden>
          <input type="text" class="txt" id="cdLabel" value="NEW YEAR" maxlength="20" placeholder="Label" spellcheck="false" autocomplete="off">
          <input type="datetime-local" class="dt" id="cdTarget">
        </div>
      </div>
    </div>

    <div class="field">
      <label for="fontSelect">Font</label>
      <select id="fontSelect"></select>
    </div>

    <div class="field">
      <label>Color</label>
      <div>
        <div class="color-controls">
          <div class="swatches" id="swatches">
            <button class="swatch active" data-color="#2dfdf5" style="background:#2dfdf5" title="Cyan"></button>
            <button class="swatch" data-color="#ffb000" style="background:#ffb000" title="Amber"></button>
            <button class="swatch" data-color="#ff3b3b" style="background:#ff3b3b" title="Red"></button>
            <button class="swatch" data-color="#39ff6a" style="background:#39ff6a" title="Green"></button>
            <button class="swatch" data-color="#f5f5f5" style="background:#f5f5f5" title="White"></button>
            <input type="color" id="customColor" value="#2dfdf5" title="Custom">
          </div>
          <button type="button" class="wheel-toggle" id="wheelToggle" title="Color wheel" aria-label="Open color wheel"></button>
        </div>
        <div class="color-wheel-panel" id="colorWheelPanel" hidden>
          <button type="button" class="wheel-close" id="wheelClose" aria-label="Close color wheel">✕</button>
          <div class="wheel-wrap">
            <canvas id="colorWheel" width="160" height="160"></canvas>
            <div class="wheel-cursor" id="wheelCursor"></div>
          </div>
          <div class="wheel-side">
            <div>
              <div class="wheel-label">Brightness</div>
              <input type="range" id="valueRange" min="0" max="100" value="100">
            </div>
            <div>
              <div class="wheel-label">Hex</div>
              <input type="text" id="hexInput" maxlength="7" value="#2DFDF5" spellcheck="false" autocomplete="off">
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="field">
      <label>Mode</label>
      <div class="segmented" id="modeSeg">
        <button data-mode="static" class="active">Static</button>
        <button data-mode="scroll">Scroll</button>
        <button data-mode="blink">Blink</button>
        <button data-mode="pulse">Pulse</button>
        <button data-mode="flicker">Flicker</button>
        <button data-mode="typewriter">Typewriter</button>
        <button data-mode="neon">Neo Sign</button>
      </div>
    </div>

    <div class="field" id="speedField">
      <label>Speed</label>
      <input type="range" id="speedRange" min="4" max="40" value="14">
    </div>

    <div class="field">
      <label>Glow</label>
      <input type="range" id="glowRange" min="0" max="100" value="55">
    </div>

    <div class="actions">
      <button class="fullscreen-btn" id="fullscreenBtn">⛶ Full Screen</button>
      <button class="dl" id="downloadBtn">Download PNG</button>
    </div>
  </div>

  <footer>made with the nanofon typeface</footer>
</div>

<div class="fs-overlay" id="fsOverlay">
  <button class="fs-exit" id="fsExit" aria-label="Exit full screen">✕</button>
  <div class="fs-rotor" id="fsRotor">
    <div class="fs-controls" id="fsControls">
      <button type="button" id="fsSmaller" aria-label="Smaller text">A−</button>
      <input type="range" id="fsSize" min="30" max="300" value="100" aria-label="Text size">
      <button type="button" id="fsBigger" aria-label="Bigger text">A+</button>
      <button type="button" id="fsClose" aria-label="Exit full screen">✕</button>
    </div>
  </div>
  <div class="fs-hint">tap to show controls</div>
</div>

<script>
(function(){
  // ---- Font library ---------------------------------------------------
  // To add a font after uploading it to your ./fount/ folder on GitHub,
  // just add one line here — nothing else in this file needs to change.
  //   { value: 'Display Name', file: 'exact-filename.ttf' }
  const FONT_LIBRARY = [
    { value: 'Nanofon', label: 'LED Pixel (default)', builtin: true },
    { value: 'Moby Bold', file: 'Moby-Bold.ttf' },
    { value: 'Hyperloop', file: 'HYPERLOOP.otf' },
    { value: 'Vultron Bold', file: 'Vultron Bold.otf' },
    { value: 'Wicked Mouse', file: 'Wicked Mouse.otf' },
    { value: 'Whimsy', label: 'Whimsy Script', file: 'Whimsy.ttf' },
    { value: 'Los Santos', file: 'Los Santos.ttf' },
    { value: 'WesternGrit', label: 'Western Grit', file: 'WesternGrit-Regular.ttf' },
    { value: 'BergenSans', file: 'BergenSans-Regular.otf' },
    { value: 'Poppins', file: 'Poppins-Regular.ttf' },
    { value: 'Austral-Sans_Maplines-Regular', file: 'Austral-Sans_Maplines-Regular.ttf' },
    { value: 'BouldenShadow', file: 'BouldenShadow.otf' },
    { value: 'Bouquet Typeface', file: 'Bouquet Typeface.otf' },
    { value: 'Carosello-Regular', file: 'Carosello-Regular.otf' },
    { value: 'EXTRADIONARY - V1', file: 'EXTRADIONARY - V1.ttf' },
    { value: 'FakeEmpire-Regular', file: 'FakeEmpire-Regular.otf' },
    { value: 'FukuCatch @Detetiive', file: 'FukuCatch @Detetiive.otf' },
    { value: 'Ganosgoco', file: 'Ganosgoco.otf' },
    { value: 'GhanesFont', file: 'GhanesFont.ttf' },
    { value: 'Annone-rxOB', file: 'Annone-rxOB.ttf' },
    { value: 'LeOsler_Rough-Border-Regular', file: 'LeOsler_Rough-Border-Regular.ttf' },
    { value: 'LeOsler_Rough-Icon-Regular', file: 'LeOsler_Rough-Icon-Regular.otf' },
    { value: 'Loomattic', file: 'Loomattic.otf' },
    { value: 'Organo', file: 'Organo.ttf' },
    { value: 'Paladise Script', file: 'Paladise Script.otf' },
    { value: 'youre gone', file: 'youre gone.otf' }
  ];

  const msgInput = document.getElementById('msgInput');
  const fontSelect = document.getElementById('fontSelect');
  const signLines = document.getElementById('signLines');
  const bezel = document.getElementById('bezel');
  const signStage = document.querySelector('.sign-stage');
  const swatches = document.getElementById('swatches');
  const customColor = document.getElementById('customColor');
  const modeSeg = document.getElementById('modeSeg');
  const speedRange = document.getElementById('speedRange');
  const speedField = document.getElementById('speedField');
  const glowRange = document.getElementById('glowRange');
  const downloadBtn = document.getElementById('downloadBtn');
  const fullscreenBtn = document.getElementById('fullscreenBtn');
  const fsOverlay = document.getElementById('fsOverlay');
  const fsExit = document.getElementById('fsExit');
  const fsRotor = document.getElementById('fsRotor');
  const fsControls = document.getElementById('fsControls');
  const fsSize = document.getElementById('fsSize');
  const fsSmaller = document.getElementById('fsSmaller');
  const fsBigger = document.getElementById('fsBigger');
  const fsClose = document.getElementById('fsClose');
  const glass = document.querySelector('.sign-stage .glass');
  const wheelToggle = document.getElementById('wheelToggle');
  const wheelClose = document.getElementById('wheelClose');
  const colorWheelPanel = document.getElementById('colorWheelPanel');
  const colorWheel = document.getElementById('colorWheel');
  const wheelCursor = document.getElementById('wheelCursor');
  const valueRange = document.getElementById('valueRange');
  const hexInput = document.getElementById('hexInput');
  const wheelCtx = colorWheel.getContext('2d');

  // Live source controls
  const sourceSeg = document.getElementById('sourceSeg');
  const optionsField = document.getElementById('optionsField');
  const hourSeg = document.getElementById('hourSeg');
  const secToggle = document.getElementById('secToggle');
  const cityInput = document.getElementById('cityInput');
  const cityGo = document.getElementById('cityGo');
  const geoBtn = document.getElementById('geoBtn');
  const unitSeg = document.getElementById('unitSeg');
  const cdLabel = document.getElementById('cdLabel');
  const cdTarget = document.getElementById('cdTarget');

  let state = {
    color: '#2dfdf5',
    mode: 'static',
    speed: 14,
    glow: 55,
    font: 'Nanofon',
    source: 'text',
    clock24: true,
    showSeconds: true,
    units: 'C'
  };

  function applyFont(){
    document.documentElement.style.setProperty('--sign-font', "'" + state.font + "'");
  }

  function initFontLibrary(){
    FONT_LIBRARY.forEach(entry=>{
      const opt = document.createElement('option');
      opt.value = entry.value;
      opt.textContent = entry.label || entry.value;
      if(entry.builtin) opt.selected = true;
      fontSelect.appendChild(opt);

      if(entry.file && 'FontFace' in window){
        const url = './fount/' + entry.file.split('/').map(encodeURIComponent).join('/');
        const face = new FontFace(entry.value, `url('${url}')`);
        face.load().then(loaded=>{
          document.fonts.add(loaded);
        }).catch(()=>{
          opt.textContent = (entry.label || entry.value) + ' (file not found)';
          opt.disabled = true;
        });
      }
    });
  }

  function hexToRgb(hex){
    const h = hex.replace('#','');
    const bigint = parseInt(h.length===3 ? h.split('').map(c=>c+c).join('') : h, 16);
    return { r:(bigint>>16)&255, g:(bigint>>8)&255, b:bigint&255 };
  }

  function rgbToHex(r,g,b){
    return '#' + [r,g,b].map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');
  }

  function hsvToRgb(h,s,v){
    h = ((h%360)+360)%360;
    const c = v*s;
    const x = c*(1-Math.abs((h/60)%2-1));
    const m = v-c;
    let r=0,g=0,b=0;
    if(h<60){ r=c; g=x; b=0; }
    else if(h<120){ r=x; g=c; b=0; }
    else if(h<180){ r=0; g=c; b=x; }
    else if(h<240){ r=0; g=x; b=c; }
    else if(h<300){ r=x; g=0; b=c; }
    else { r=c; g=0; b=x; }
    return { r:(r+m)*255, g:(g+m)*255, b:(b+m)*255 };
  }

  function rgbToHsv(r,g,b){
    r/=255; g/=255; b/=255;
    const max = Math.max(r,g,b), min = Math.min(r,g,b);
    const d = max-min;
    let h = 0;
    if(d !== 0){
      if(max===r) h = 60*(((g-b)/d)%6);
      else if(max===g) h = 60*((b-r)/d+2);
      else h = 60*((r-g)/d+4);
    }
    if(h<0) h += 360;
    const s = max===0 ? 0 : d/max;
    const v = max;
    return { h, s, v };
  }

  // ---- Color wheel ----
  const wheelRadius = colorWheel.width/2;
  let wheelHue = 180, wheelSat = 0.82;

  function drawWheel(){
    const size = colorWheel.width;
    const cx = size/2, cy = size/2;
    const img = wheelCtx.createImageData(size, size);
    const v = valueRange.value/100;
    for(let y=0; y<size; y++){
      for(let x=0; x<size; x++){
        const dx = x-cx, dy = y-cy;
        const dist = Math.sqrt(dx*dx+dy*dy);
        const idx = (y*size+x)*4;
        if(dist <= wheelRadius){
          const angle = Math.atan2(dy,dx) * 180/Math.PI;
          const sat = Math.min(1, dist/wheelRadius);
          const {r,g,b} = hsvToRgb(angle, sat, v);
          img.data[idx] = r; img.data[idx+1] = g; img.data[idx+2] = b; img.data[idx+3] = 255;
        } else {
          img.data[idx+3] = 0;
        }
      }
    }
    wheelCtx.putImageData(img, 0, 0);
  }

  function positionWheelCursor(){
    const size = colorWheel.width;
    const cx = size/2, cy = size/2;
    const rad = wheelHue * Math.PI/180;
    const dist = wheelSat * wheelRadius;
    const x = cx + Math.cos(rad)*dist;
    const y = cy + Math.sin(rad)*dist;
    wheelCursor.style.left = (x/size*100) + '%';
    wheelCursor.style.top = (y/size*100) + '%';
  }

  function setColorFromWheel(){
    const {r,g,b} = hsvToRgb(wheelHue, wheelSat, valueRange.value/100);
    setColor(rgbToHex(r,g,b), 'wheel');
  }

  function syncWheelFromColor(hex){
    const {r,g,b} = hexToRgb(hex);
    const {h,s,v} = rgbToHsv(r,g,b);
    wheelHue = h; wheelSat = s;
    valueRange.value = Math.round(v*100);
    drawWheel();
    positionWheelCursor();
    hexInput.value = hex.toUpperCase();
  }

  function setColor(hex, source){
    state.color = hex;
    customColor.value = hex;
    swatches.querySelectorAll('.swatch').forEach(b=>{
      b.classList.toggle('active', b.dataset.color.toLowerCase() === hex.toLowerCase());
    });
    if(source !== 'wheel') syncWheelFromColor(hex);
    else hexInput.value = hex.toUpperCase();
    applyColor();
  }

  function wheelPointerToHsv(clientX, clientY){
    const rect = colorWheel.getBoundingClientRect();
    const scale = colorWheel.width / rect.width;
    const x = (clientX - rect.left) * scale;
    const y = (clientY - rect.top) * scale;
    const cx = colorWheel.width/2, cy = colorWheel.height/2;
    const dx = x-cx, dy = y-cy;
    const dist = Math.min(wheelRadius, Math.sqrt(dx*dx+dy*dy));
    let angle = Math.atan2(dy,dx) * 180/Math.PI;
    return { hue: angle, sat: dist/wheelRadius };
  }

  let wheelDragging = false;
  function handleWheelPointer(e){
    const point = e.touches ? e.touches[0] : e;
    const { hue, sat } = wheelPointerToHsv(point.clientX, point.clientY);
    wheelHue = hue; wheelSat = sat;
    positionWheelCursor();
    setColorFromWheel();
  }
  colorWheel.addEventListener('pointerdown', (e)=>{
    wheelDragging = true;
    colorWheel.setPointerCapture(e.pointerId);
    handleWheelPointer(e);
  });
  colorWheel.addEventListener('pointermove', (e)=>{
    if(wheelDragging) handleWheelPointer(e);
  });
  colorWheel.addEventListener('pointerup', ()=>{ wheelDragging = false; });
  colorWheel.addEventListener('pointercancel', ()=>{ wheelDragging = false; });

  valueRange.addEventListener('input', ()=>{
    drawWheel();
    setColorFromWheel();
  });

  hexInput.addEventListener('change', ()=>{
    let v = hexInput.value.trim();
    if(!v.startsWith('#')) v = '#'+v;
    if(/^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$/.test(v)){
      if(v.length===4) v = '#'+v[1]+v[1]+v[2]+v[2]+v[3]+v[3];
      setColor(v.toLowerCase());
    } else {
      hexInput.value = state.color.toUpperCase();
    }
  });

  wheelToggle.addEventListener('click', ()=>{
    const opening = colorWheelPanel.hidden;
    colorWheelPanel.hidden = !opening;
    wheelToggle.classList.toggle('active', opening);
    if(opening){ drawWheel(); positionWheelCursor(); }
  });

  wheelClose.addEventListener('click', ()=>{
    colorWheelPanel.hidden = true;
    wheelToggle.classList.remove('active');
  });

  function applyColor(){
    const {r,g,b} = hexToRgb(state.color);
    const glowA = (state.glow/100);
    document.documentElement.style.setProperty('--led', state.color);
    document.documentElement.style.setProperty('--led-glow', `rgba(${r},${g},${b},${(0.15+glowA*0.65).toFixed(2)})`);
    document.documentElement.style.setProperty('--led-dim', `rgba(${r},${g},${b},0.5)`);
    const bezelGlow = 0.15 + glowA*0.4;
    bezel.style.boxShadow = `0 1px 0 rgba(255,255,255,0.06) inset, 0 -2px 6px rgba(0,0,0,0.6) inset, 0 18px 40px rgba(0,0,0,0.55), 0 0 ${40+glowA*70}px rgba(${r},${g},${b},${bezelGlow.toFixed(2)})`;
  }

  // ---- Live sources: clock / date / weather / countdown ----
  const DAYS = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
  const MONTHS = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  const pad = n => String(n).padStart(2,'0');

  function weatherWord(c){
    if(c === 0) return 'CLEAR';
    if(c === 1) return 'MOSTLY CLEAR';
    if(c === 2) return 'PARTLY CLOUDY';
    if(c === 3) return 'CLOUDY';
    if(c === 45 || c === 48) return 'FOG';
    if(c >= 51 && c <= 55) return 'DRIZZLE';
    if(c === 56 || c === 57) return 'FREEZING DRIZZLE';
    if(c === 61 || c === 63) return 'RAIN';
    if(c === 65) return 'HEAVY RAIN';
    if(c === 66 || c === 67) return 'FREEZING RAIN';
    if(c === 71 || c === 73) return 'SNOW';
    if(c === 75 || c === 77) return 'HEAVY SNOW';
    if(c >= 80 && c <= 82) return 'SHOWERS';
    if(c === 85 || c === 86) return 'SNOW SHOWERS';
    if(c === 95) return 'THUNDERSTORM';
    if(c === 96 || c === 99) return 'HAIL STORM';
    return 'WEATHER';
  }

  let weatherPlace = null;           // { lat, lon, name }
  let weatherLines = ['LOADING...'];

  async function geocode(name){
    const r = await fetch('https://geocoding-api.open-meteo.com/v1/search?count=1&name=' + encodeURIComponent(name));
    const j = await r.json();
    if(!j.results || !j.results.length) throw new Error('city not found');
    const p = j.results[0];
    return { lat: p.latitude, lon: p.longitude, name: p.name };
  }

  async function loadWeather(){
    try{
      if(!weatherPlace) weatherPlace = await geocode(cityInput.value.trim() || 'Tokyo');
      const unit = state.units === 'F' ? '&temperature_unit=fahrenheit' : '';
      const url = 'https://api.open-meteo.com/v1/forecast?latitude=' + weatherPlace.lat +
                  '&longitude=' + weatherPlace.lon + '&current=temperature_2m,weather_code' + unit;
      const r = await fetch(url);
      const j = await r.json();
      const t = Math.round(j.current.temperature_2m);
      weatherLines = [
        weatherPlace.name.toUpperCase(),
        t + '°' + state.units,
        weatherWord(j.current.weather_code)
      ];
    } catch(err){
      weatherLines = ['WEATHER', 'UNAVAILABLE'];
      weatherPlace = null;   // retry the lookup next time
    }
    updateLive();
  }

  function countdownLines(){
    const label = (cdLabel.value.trim() || 'COUNTDOWN').toUpperCase();
    if(!cdTarget.value) return [label, 'SET A DATE'];
    const diff = new Date(cdTarget.value).getTime() - Date.now();
    if(diff <= 0) return [label, 'TIME UP'];
    const s = Math.floor(diff / 1000);
    const d = Math.floor(s / 86400);
    const h = Math.floor((s % 86400) / 3600);
    const m = Math.floor((s % 3600) / 60);
    const sec = s % 60;
    return [label, (d > 0 ? d + 'D ' : '') + pad(h) + ':' + pad(m) + ':' + pad(sec)];
  }

  function getLines(){
    const now = new Date();
    switch(state.source){
      case 'clock': {
        let h = now.getHours(), suffix = '';
        if(!state.clock24){ suffix = h >= 12 ? ' PM' : ' AM'; h = h % 12 || 12; }
        const hh = state.clock24 ? pad(h) : String(h);
        const t = hh + ':' + pad(now.getMinutes()) + (state.showSeconds ? ':' + pad(now.getSeconds()) : '');
        return [t + suffix];
      }
      case 'date':
        return [DAYS[now.getDay()], MONTHS[now.getMonth()] + ' ' + now.getDate()];
      case 'weather':
        return weatherLines;
      case 'countdown':
        return countdownLines();
      default:
        return msgInput.value.split('\n').slice(0,4);
    }
  }

  // Update text in place once per second so scroll/blink/etc. animations don't restart
  function updateLive(){
    if(state.source === 'text') return;
    const lines = getLines();
    const divs = signLines.children;
    if(divs.length !== lines.length){ render(); return; }
    lines.forEach((line, i) => {
      const text = line.length ? line : '\u00a0';
      const div = divs[i];
      div.textContent = state.mode === 'scroll'
        ? (text + '\u00a0\u00a0\u00a0\u00a0\u00a0').repeat(2)
        : text;
      if(state.mode === 'neon') div.dataset.text = text;
      div.classList.toggle('empty', line.trim() === '');
    });
  }
  setInterval(updateLive, 1000);
  // Weather refreshes every 5 minutes while the Weather source is active
  setInterval(()=>{ if(state.source === 'weather') loadWeather(); }, 5 * 60 * 1000);

  // ---- Typewriter (Text source only) ----
  let typewriterTimer = null;
  function clearTypewriter(){
    if(typewriterTimer){
      clearInterval(typewriterTimer);
      clearTimeout(typewriterTimer);
      typewriterTimer = null;
    }
  }

  function startTypewriter(lines){
    const divs = lines.map(line=>{
      const div = document.createElement('div');
      div.className = 'sign-line' + (line.trim()==='' ? ' empty' : '');
      if(!line.length){
        div.textContent = '\u00a0';
      } else {
        const shownSpan = document.createElement('span');
        const hiddenSpan = document.createElement('span');
        hiddenSpan.className = 'not-typed';
        hiddenSpan.textContent = line;
        div.appendChild(shownSpan);
        div.appendChild(hiddenSpan);
      }
      signLines.appendChild(div);
      return div;
    });
    const maxLen = Math.max(1, ...lines.map(l=>l.length));
    const stepDelay = Math.max(35, 300 - state.speed*8);
    let i = 0;
    function tick(){
      divs.forEach((div, idx)=>{
        const line = lines[idx];
        if(!line.length) return;
        const shownSpan = div.children[0];
        const hiddenSpan = div.children[1];
        shownSpan.classList.remove('caret');
        shownSpan.textContent = line.slice(0, i);
        hiddenSpan.textContent = line.slice(i);
      });
      if(divs.length && divs[divs.length-1].children[0]){
        divs[divs.length-1].children[0].classList.add('caret');
      }
      i++;
      if(i > maxLen){
        clearTypewriter();
        typewriterTimer = setTimeout(()=>{ i = 0; typewriterTimer = setInterval(tick, stepDelay); }, 1100);
      }
    }
    typewriterTimer = setInterval(tick, stepDelay);
  }

  function render(){
    const lines = getLines();
    clearTypewriter();
    signLines.innerHTML = '';
    signLines.classList.toggle('scrolling', state.mode==='scroll');
    signLines.classList.toggle('blinking', state.mode==='blink');
    signLines.classList.toggle('pulsing', state.mode==='pulse');
    signLines.classList.toggle('flickering', state.mode==='flicker');
    signLines.classList.toggle('neon-mode', state.mode==='neon');
    glass.classList.toggle('neon-active', state.mode==='neon');

    if(state.mode === 'typewriter' && state.source === 'text'){
      startTypewriter(lines);
    } else {
      lines.forEach(line=>{
        const div = document.createElement('div');
        div.className = 'sign-line' + (line.trim()==='' ? ' empty' : '');
        if(state.mode === 'scroll'){
          const text = line.length ? line : '\u00a0';
          div.textContent = (text + '\u00a0\u00a0\u00a0\u00a0\u00a0') .repeat(2);
          div.style.animationDuration = (Math.max(2, (44 - state.speed)) ) + 's';
        } else {
          const text = line.length ? line : '\u00a0';
          div.textContent = text;
          if(state.mode === 'neon') div.dataset.text = text;
        }
        signLines.appendChild(div);
      });
    }

    const speedActive = state.mode === 'scroll' || (state.mode === 'typewriter' && state.source === 'text');
    speedField.style.opacity = speedActive ? '1' : '0.35';
    speedRange.disabled = !speedActive;
  }

  msgInput.addEventListener('input', render);

  swatches.querySelectorAll('.swatch').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      setColor(btn.dataset.color);
    });
  });

  customColor.addEventListener('input', ()=>{
    setColor(customColor.value);
  });

  modeSeg.querySelectorAll('button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      modeSeg.querySelectorAll('button').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      state.mode = btn.dataset.mode;
      render();
    });
  });

  speedRange.addEventListener('input', ()=>{
    state.speed = parseInt(speedRange.value,10);
    render();
  });

  glowRange.addEventListener('input', ()=>{
    state.glow = parseInt(glowRange.value,10);
    applyColor();
  });

  fontSelect.addEventListener('change', ()=>{
    state.font = fontSelect.value;
    applyFont();
  });

  downloadBtn.addEventListener('click', ()=>{
    const lines = getLines();
    const scale = 4;
    const fontSize = 42 * scale;
    const padX = 60*scale, padY = 40*scale;
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    ctx.font = fontSize + "px '" + state.font + "'";
    let maxW = 0;
    lines.forEach(l=>{
      const w = ctx.measureText(l.length?l:' ').width;
      if(w>maxW) maxW = w;
    });
    const lineH = fontSize*1.25;
    canvas.width = Math.max(400, maxW + padX*2);
    canvas.height = lines.length*lineH + padY*2;

    ctx.fillStyle = '#060a0b';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.font = fontSize + "px '" + state.font + "'";
    ctx.textBaseline = 'top';
    ctx.fillStyle = state.color;
    ctx.shadowColor = state.color;
    ctx.shadowBlur = 20 + (state.glow/100)*40;
    lines.forEach((l,i)=>{
      ctx.fillText(l.length?l:' ', padX, padY + i*lineH);
    });

    const link = document.createElement('a');
    link.download = 'nanofon-sign.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  });

  // ---- Source selector and options ----
  function showOptions(){
    let any = false;
    optionsField.querySelectorAll('.opt-group').forEach(g => {
      const on = g.dataset.for === state.source;
      g.hidden = !on;
      if(on) any = true;
    });
    optionsField.hidden = !any;
    msgInput.closest('.field').style.opacity = state.source === 'text' ? '1' : '0.35';
  }

  sourceSeg.querySelectorAll('button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      sourceSeg.querySelectorAll('button').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      state.source = btn.dataset.source;
      showOptions();
      if(state.source === 'weather') loadWeather();
      render();
    });
  });

  hourSeg.querySelectorAll('button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      hourSeg.querySelectorAll('button').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      state.clock24 = btn.dataset.h === '24';
      render();
    });
  });
  secToggle.addEventListener('change', ()=>{ state.showSeconds = secToggle.checked; render(); });

  unitSeg.querySelectorAll('button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      unitSeg.querySelectorAll('button').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      state.units = btn.dataset.u;
      loadWeather();
    });
  });
  function searchCity(){ weatherPlace = null; weatherLines = ['LOADING...']; render(); loadWeather(); }
  cityGo.addEventListener('click', searchCity);
  cityInput.addEventListener('keydown', e=>{ if(e.key === 'Enter') searchCity(); });
  geoBtn.addEventListener('click', ()=>{
    if(!navigator.geolocation){ weatherLines = ['NO GPS']; render(); return; }
    weatherLines = ['LOCATING...']; render();
    navigator.geolocation.getCurrentPosition(
      p => { weatherPlace = { lat: p.coords.latitude, lon: p.coords.longitude, name: 'My location' }; loadWeather(); },
      () => { weatherLines = ['LOCATION', 'DENIED']; render(); }
    );
  });

  cdLabel.addEventListener('input', render);
  cdTarget.addEventListener('input', render);

  // ---- Full screen ----
  function updateOrientationClass(){
    const ua = navigator.userAgent || '';
    const isPhoneOrTablet = /Android|iPhone|iPad|iPod|Mobile/i.test(ua) ||
      (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);   // iPadOS
    const isLandscape = window.matchMedia('(orientation: landscape)').matches;
    fsOverlay.classList.toggle('landscape-native', !isPhoneOrTablet || isLandscape);
    fsOverlay.classList.toggle('pc-mode', !isPhoneOrTablet);
  }

  // Full screen text size controls
  let controlsTimer = null;
  function showControls(){
    fsControls.classList.add('show');
    clearTimeout(controlsTimer);
    controlsTimer = setTimeout(()=> fsControls.classList.remove('show'), 4000);
  }
  function hideControls(){
    clearTimeout(controlsTimer);
    fsControls.classList.remove('show');
  }
  function setFsScale(percent){
    percent = Math.max(30, Math.min(300, percent));
    fsSize.value = percent;
    fsOverlay.style.setProperty('--fs-scale', percent / 100);
  }

  function enterFullscreen(){
    fsRotor.appendChild(bezel);
    fsOverlay.classList.add('active');
    document.body.style.overflow = 'hidden';
    updateOrientationClass();
    const el = fsOverlay;
    try{
      const req = el.requestFullscreen || el.webkitRequestFullscreen;
      if(req){
        const p = req.call(el);
        const tryLock = ()=>{
          if(screen.orientation && screen.orientation.lock){
            screen.orientation.lock('landscape').catch(()=>{});
          }
        };
        if(p && p.then) p.then(tryLock).catch(()=>{});
        else tryLock();
      }
    } catch(err){ /* fullscreen not available, CSS rotation still covers the screen */ }
  }

  function exitFullscreen(){
    hideControls();
    signStage.appendChild(bezel);
    fsOverlay.classList.remove('active');
    document.body.style.overflow = '';
    try{
      if(screen.orientation && screen.orientation.unlock) screen.orientation.unlock();
    } catch(err){ /* ignore */ }
    try{
      if(document.fullscreenElement || document.webkitFullscreenElement){
        const exit = document.exitFullscreen || document.webkitExitFullscreen;
        if(exit){
          const p = exit.call(document);
          if(p && p.catch) p.catch(()=>{});
        }
      }
    } catch(err){ /* ignore */ }
  }

  window.addEventListener('resize', ()=>{
    if(fsOverlay.classList.contains('active')) updateOrientationClass();
  });

  fullscreenBtn.addEventListener('click', enterFullscreen);
  fsExit.addEventListener('click', (e)=>{
    e.stopPropagation();
    exitFullscreen();
  });

  // Tap/click the sign toggles the control bar (instead of exiting)
  fsOverlay.addEventListener('click', ()=>{
    if(fsControls.classList.contains('show')) hideControls();
    else showControls();
  });
  // Mouse movement reveals the bar on desktop (ignored for touch)
  fsOverlay.addEventListener('pointermove', (e)=>{
    if(e.pointerType === 'mouse' && fsOverlay.classList.contains('active')) showControls();
  });

  // Clicks inside the control bar must not toggle it
  fsControls.addEventListener('click', (e)=>{ e.stopPropagation(); showControls(); });
  fsSize.addEventListener('input', ()=>{ setFsScale(parseInt(fsSize.value,10)); showControls(); });
  fsSmaller.addEventListener('click', ()=> setFsScale(parseInt(fsSize.value,10) - 10));
  fsBigger.addEventListener('click', ()=> setFsScale(parseInt(fsSize.value,10) + 10));
  fsClose.addEventListener('click', exitFullscreen);

  document.addEventListener('keydown', (e)=>{
    if(!fsOverlay.classList.contains('active')) return;
    if(e.key === 'Escape') exitFullscreen();
    else if(e.key === '+' || e.key === '=') { setFsScale(parseInt(fsSize.value,10) + 10); showControls(); }
    else if(e.key === '-') { setFsScale(parseInt(fsSize.value,10) - 10); showControls(); }
  });
  document.addEventListener('fullscreenchange', ()=>{
    if(!document.fullscreenElement && fsOverlay.classList.contains('active')) exitFullscreen();
  });
  document.addEventListener('webkitfullscreenchange', ()=>{
    if(!document.webkitFullscreenElement && fsOverlay.classList.contains('active')) exitFullscreen();
  });

  // Default countdown target: 3 days from now (so it isn't empty on first use)
  (function(){
    const t = new Date(Date.now() + 3*864e5);
    cdTarget.value = new Date(t - t.getTimezoneOffset()*6e4).toISOString().slice(0,16);
  })();

  applyColor();
  initFontLibrary();
  applyFont();
  showOptions();
  render();
  syncWheelFromColor(state.color);
})();
</script>

</body>
</html>
