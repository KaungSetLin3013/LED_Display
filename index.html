<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nanofon">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.ico" sizes="48x48">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#05070a">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&display=swap"><title>Nanofon — LED Sign Shop</title>
<style>

:root{
  --bg-void:#05070a;--panel-metal:#14181b;--panel-metal-hi:#21272b;--panel-metal-lo:#0a0c0e;
  --sign-face:#060a0b;--dot-off:#101a1c;--text-chrome:#8fa3a8;--text-chrome-dim:#52646a;
  --led:#2dfdf5;--led-glow:rgba(45,253,245,.55);--led-dim:rgba(45,253,245,.5);
  --mono:'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace;--radius-sm:4px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100%;background:var(--bg-void);color:var(--text-chrome);font-family:var(--mono);
  background-image:radial-gradient(ellipse 900px 500px at 50% 8%,rgba(45,253,245,.05),transparent 60%),repeating-linear-gradient(0deg,rgba(255,255,255,.012) 0,rgba(255,255,255,.012) 1px,transparent 1px,transparent 3px);
  -webkit-font-smoothing:antialiased}
.wrap{max-width:880px;margin:0 auto;padding:28px 18px 60px}
header.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:22px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.brand .dot{width:8px;height:8px;border-radius:50%;background:var(--led);box-shadow:0 0 8px 2px var(--led-glow);animation:blink-slow 2.4s ease-in-out infinite}
.brand h1{font-family:'VT323',var(--mono);font-weight:400;font-size:22px;letter-spacing:2px;margin:0;color:#cfe9e8;text-shadow:0 0 10px rgba(45,253,245,.25)}
.brand .sub,header.top .meta{font-size:10px;letter-spacing:2px;color:var(--text-chrome-dim);text-transform:uppercase}
header.top .meta{text-align:right}
@keyframes blink-slow{0%,100%{opacity:1}50%{opacity:.35}}

/* ---- The sign ---- */
.sign-stage{display:flex;justify-content:center;padding:36px 10px 44px}
.bezel{position:relative;width:100%;max-width:640px;border-radius:14px;padding:22px;transition:box-shadow .4s ease;
  background:linear-gradient(155deg,var(--panel-metal-hi),var(--panel-metal) 40%,var(--panel-metal-lo));
  box-shadow:0 1px 0 rgba(255,255,255,.06) inset,0 -2px 6px rgba(0,0,0,.6) inset,0 18px 40px rgba(0,0,0,.55)}
.screw{position:absolute;width:10px;height:10px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#3a4247,#0c0f11 70%);box-shadow:0 1px 1px rgba(255,255,255,.15) inset,0 1px 2px rgba(0,0,0,.6)}
.screw::after{content:'';position:absolute;top:50%;left:50%;width:6px;height:1.5px;background:rgba(0,0,0,.7);transform:translate(-50%,-50%) rotate(38deg)}
.screw.tl{top:9px;left:9px}.screw.tr{top:9px;right:9px}.screw.bl{bottom:9px;left:9px}.screw.br{bottom:9px;right:9px}
.glass{position:relative;overflow:hidden;width:100%;border-radius:6px;padding:30px 26px;
  background:radial-gradient(circle at 12px 12px,var(--dot-off) 1.1px,transparent 1.3px) 0 0/16px 16px,var(--sign-face);
  box-shadow:0 0 0 1px rgba(0,0,0,.6) inset,0 2px 14px rgba(0,0,0,.7) inset}
.glass::before{content:'';position:absolute;inset:0;pointer-events:none;mix-blend-mode:multiply;background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0,rgba(0,0,0,.22) 1px,transparent 1px,transparent 3px)}
.marquee-track{overflow:hidden;width:100%}
.sign-lines{display:flex;flex-direction:column;align-items:center;gap:14px;width:max-content;margin:0 auto;
  transform:translate(var(--bx,0px),var(--by,0px));transition:transform 3s ease}
.sign-line{font-family:var(--sign-font,'VT323'),var(--mono);font-size:42px;line-height:1.5;white-space:pre;letter-spacing:5px;color:var(--led);
  text-shadow:0 0 2px var(--led),0 0 10px var(--led-glow),0 0 26px var(--led-glow);transition:color .3s ease,text-shadow .3s ease}
.sign-line.empty::after{content:'\00a0'}
.sign-lines.scrolling .sign-line{display:inline-block;animation:marquee linear infinite;padding-right:60px}
@keyframes marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.sign-lines.blinking .sign-line{animation:blink-hard 1s steps(1,end) infinite}
@keyframes blink-hard{0%,55%{opacity:1}56%,100%{opacity:.12}}
.sign-lines.pulsing .sign-line{animation:pulse-glow 2.6s ease-in-out infinite}
@keyframes pulse-glow{0%,100%{opacity:1}50%{opacity:.35}}
.sign-lines.flickering .sign-line{animation:neon-flicker 3s linear infinite}
@keyframes neon-flicker{0%,18%,22%,25%,53%,57%,100%{opacity:1}20%,24%,55%,56%{opacity:.25}21%{opacity:.6}}
.sign-line .not-typed{opacity:0}
.caret::after{content:'';display:inline-block;width:3px;height:.9em;margin-left:2px;background:currentColor;vertical-align:-.1em;animation:cursor-blink .9s steps(1,end) infinite}
@keyframes cursor-blink{0%,50%{opacity:1}51%,100%{opacity:0}}
/* Neo Sign */
.glass.neon-active::after{content:'';position:absolute;inset:0;pointer-events:none;mix-blend-mode:multiply;animation:scanline-drift 6s linear infinite;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.25) 0,rgba(0,0,0,.25) 1px,transparent 1px,transparent 3px)}
@keyframes scanline-drift{from{background-position:0 0}to{background-position:0 12px}}
.sign-lines.neon-mode .sign-line{color:var(--led-dim);-webkit-text-stroke:1.5px var(--led);text-stroke:1.5px var(--led);
  text-shadow:0 0 2px var(--led),0 0 12px var(--led-glow),0 0 34px var(--led-glow),0 0 70px var(--led-glow)}
.sign-lines.neon-mode .sign-line:not(.empty){position:relative}
.sign-lines.neon-mode .sign-line:not(.empty)::before,.sign-lines.neon-mode .sign-line:not(.empty)::after{content:attr(data-text);position:absolute;left:0;top:0;width:100%;pointer-events:none;opacity:0}
.sign-lines.neon-mode .sign-line:not(.empty)::before{color:#ff2bd6;animation:glitch-split-1 5s infinite steps(1,end)}
.sign-lines.neon-mode .sign-line:not(.empty)::after{color:#2bfff0;animation:glitch-split-2 5s infinite steps(1,end)}
@keyframes glitch-split-1{0%,91%,100%{opacity:0;transform:translate(0,0);clip-path:inset(0 0 0 0)}92%{opacity:.75;transform:translate(-2px,0);clip-path:inset(15% 0 55% 0)}93%{opacity:.6;transform:translate(1px,0);clip-path:inset(55% 0 10% 0)}94%{opacity:0;transform:translate(0,0)}}
@keyframes glitch-split-2{0%,89%,100%{opacity:0;transform:translate(0,0);clip-path:inset(0 0 0 0)}90%{opacity:.7;transform:translate(2px,0);clip-path:inset(40% 0 25% 0)}91%{opacity:.55;transform:translate(-1px,0);clip-path:inset(10% 0 60% 0)}92%{opacity:0;transform:translate(0,0)}}

/* ---- Controls ---- */
.panel{background:linear-gradient(180deg,rgba(255,255,255,.02),rgba(255,255,255,0));border:1px solid rgba(255,255,255,.06);border-radius:10px;padding:22px}
.field{display:grid;grid-template-columns:90px 1fr;gap:16px;align-items:center;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.field:last-child{border-bottom:none}
.field[hidden],.opt-group[hidden],.start-screen[hidden]{display:none}
.field>label,.wheel-label{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--text-chrome-dim)}
input#msgInput,input#hexInput,select#fontSelect,input.txt,input.dt{background:var(--panel-metal-lo);border:1px solid rgba(255,255,255,.08);border-radius:var(--radius-sm);color:#d7f5f4;font-family:var(--mono);font-size:13px;outline:none;min-width:0}
input#msgInput,select#fontSelect{width:100%;padding:10px 12px}
input#hexInput{width:100%;padding:8px 10px;text-transform:uppercase}
input.txt,input.dt{padding:9px 10px;flex:1 1 140px;color-scheme:dark}
input#msgInput:focus,input#hexInput:focus,select#fontSelect:focus,input.txt:focus,input.dt:focus{border-color:var(--led);box-shadow:0 0 0 1px var(--led-glow)}
select#fontSelect{cursor:pointer;appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--text-chrome-dim) 50%),linear-gradient(135deg,var(--text-chrome-dim) 50%,transparent 50%);background-position:calc(100% - 18px) center,calc(100% - 13px) center;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
select#fontSelect option{background:var(--panel-metal-lo);color:#d7f5f4}
.swatches,.color-controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.swatch,.wheel-toggle{width:26px;height:26px;border-radius:50%;border:2px solid rgba(255,255,255,.12);cursor:pointer;padding:0;position:relative}
.swatch.active,.wheel-toggle.active{border-color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.08)}
.wheel-toggle{flex:0 0 auto;background:conic-gradient(from 0deg,#ff3b3b,#ffb000,#f5f560,#39ff6a,#2dfdf5,#3b6bff,#b23bff,#ff3b3b)}
.wheel-toggle::after{content:'';position:absolute;inset:5px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.9),rgba(255,255,255,0) 70%)}
input[type=color]#customColor{width:26px;height:26px;border:none;border-radius:50%;background:none;cursor:pointer;padding:0}
input[type=color]#customColor::-webkit-color-swatch-wrapper{padding:0}
input[type=color]#customColor::-webkit-color-swatch{border-radius:50%;border:2px solid rgba(255,255,255,.12)}
.color-wheel-panel{position:relative;margin-top:14px;padding:16px;border-radius:8px;background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.06);display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.color-wheel-panel[hidden]{display:none}
.wheel-close{position:absolute;top:8px;right:8px;width:22px;height:22px;border-radius:50%;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.05);color:var(--text-chrome);font-size:12px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
.wheel-close:hover{border-color:var(--led);color:var(--led)}
.wheel-wrap{position:relative;width:160px;height:160px;flex:0 0 auto}
.wheel-wrap canvas{width:100%;height:100%;border-radius:50%;display:block;cursor:crosshair;box-shadow:0 0 0 1px rgba(255,255,255,.1),0 4px 16px rgba(0,0,0,.5)}
.wheel-cursor{position:absolute;width:14px;height:14px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.5),0 0 6px rgba(0,0,0,.4);transform:translate(-50%,-50%);pointer-events:none}
.wheel-side{display:flex;flex-direction:column;gap:10px;flex:1 1 140px;min-width:140px}
.segmented{display:inline-flex;flex-wrap:wrap;background:var(--panel-metal-lo);border-radius:var(--radius-sm);padding:3px;gap:3px;border:1px solid rgba(255,255,255,.06)}
.segmented button{background:none;border:none;color:var(--text-chrome-dim);font-family:var(--mono);font-size:11px;letter-spacing:1px;text-transform:uppercase;padding:6px 12px;border-radius:3px;cursor:pointer}
.segmented button.active{background:rgba(45,253,245,.1);color:var(--led);box-shadow:0 0 0 1px rgba(45,253,245,.3) inset}
.opt-group{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.opt-group+.opt-group{margin-top:10px}
.check{display:flex;align-items:center;gap:6px;cursor:pointer}
.check input{accent-color:var(--led)}
input[type=range]{-webkit-appearance:none;width:100%;height:3px;background:rgba(255,255,255,.12);border-radius:2px;outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:var(--led);box-shadow:0 0 6px var(--led-glow);cursor:pointer;margin-top:-5px}
input[type=range]::-moz-range-thumb{width:13px;height:13px;border:none;border-radius:50%;background:var(--led);box-shadow:0 0 6px var(--led-glow);cursor:pointer}
.actions{display:flex;justify-content:flex-end;margin-top:18px;gap:10px;flex-wrap:wrap}
button.dl,button.fullscreen-btn,.mini-btn{background:transparent;border:1px solid rgba(45,253,245,.4);color:var(--led);font-family:var(--mono);text-transform:uppercase;border-radius:var(--radius-sm);cursor:pointer;transition:background .2s ease}
button.dl,button.fullscreen-btn{font-size:11px;letter-spacing:1.5px;padding:10px 16px}
.mini-btn{font-size:11px;letter-spacing:1px;padding:9px 12px}
button.dl:hover,button.fullscreen-btn:hover,.mini-btn:hover{background:rgba(45,253,245,.08)}
footer{text-align:center;margin-top:30px;font-size:10px;letter-spacing:1.5px;color:var(--text-chrome-dim);text-transform:uppercase}
button,.swatch,.segmented button,input[type=range]{-webkit-tap-highlight-color:transparent;touch-action:manipulation}

/* ---- Fullscreen LED display ---- */
.fs-overlay{position:fixed;inset:0;z-index:9999;display:none;align-items:center;justify-content:center;background:var(--bg-void)}
.fs-overlay.active{display:flex}
.fs-overlay.idle,.fs-overlay.idle *{cursor:none}
.fs-rotor{position:absolute;top:50%;left:50%;width:100vh;height:100vw;transform:translate(-50%,-50%) rotate(90deg);transform-origin:center center;display:flex;align-items:center;justify-content:center;filter:brightness(var(--fs-bright,1))}
.fs-overlay.landscape-native .fs-rotor{width:100vw;height:100vh;transform:translate(-50%,-50%)}
.fs-rotor .bezel{width:90%;max-width:none;padding:3vh 4vh;border-radius:2vh}
.fs-overlay.landscape-native .fs-rotor .bezel{padding:3vw 4vw;border-radius:2vw}
.fs-rotor .glass{min-width:0;width:100%;padding:4vh;border-radius:1.2vh}
.fs-overlay.landscape-native .fs-rotor .glass{padding:4vw;border-radius:1.2vw}
.fs-rotor .screw{width:1.4vh;height:1.4vh}
.fs-overlay.landscape-native .fs-rotor .screw{width:1.4vw;height:1.4vw}
.fs-rotor .screw.tl{top:1.2vh;left:1.2vh}.fs-rotor .screw.tr{top:1.2vh;right:1.2vh}.fs-rotor .screw.bl{bottom:1.2vh;left:1.2vh}.fs-rotor .screw.br{bottom:1.2vh;right:1.2vh}
.fs-overlay.landscape-native .fs-rotor .screw.tl{top:1.2vw;left:1.2vw}.fs-overlay.landscape-native .fs-rotor .screw.tr{top:1.2vw;right:1.2vw}
.fs-overlay.landscape-native .fs-rotor .screw.bl{bottom:1.2vw;left:1.2vw}.fs-overlay.landscape-native .fs-rotor .screw.br{bottom:1.2vw;right:1.2vw}
.fs-rotor .sign-lines{gap:3vw}
.fs-overlay.landscape-native .fs-rotor .sign-lines{gap:3vh}
.fs-rotor .sign-line{font-size:calc(clamp(28px,12vh,160px)*var(--fs-scale,1))}
.fs-overlay.landscape-native .fs-rotor .sign-line{font-size:calc(clamp(28px,12vw,160px)*var(--fs-scale,1))}
.fs-exit{position:absolute;top:calc(16px + env(safe-area-inset-top));right:calc(16px + env(safe-area-inset-right));z-index:2;width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.05);color:var(--text-chrome);font-size:18px;line-height:1;cursor:pointer}
.fs-hint{position:absolute;bottom:calc(18px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--text-chrome-dim);pointer-events:none}
.fs-controls{position:absolute;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:5;display:flex;align-items:center;gap:12px;padding:10px 14px;background:rgba(10,12,14,.85);border:1px solid rgba(255,255,255,.12);border-radius:999px;opacity:0;pointer-events:none;transition:opacity .25s ease}
.fs-controls.show{opacity:1;pointer-events:auto}
.fs-controls button{background:none;border:1px solid rgba(255,255,255,.2);color:var(--text-chrome);font-family:var(--mono);font-size:13px;min-width:38px;height:38px;border-radius:50%;cursor:pointer}
.fs-controls button:hover{border-color:var(--led);color:var(--led)}
.fs-controls input[type=range]{width:160px}
/* Source selector: sci-fi minimal tabs */
.segmented.srcbar{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:0;width:100%;padding:0;background:none;border:none;border-radius:0}
.srcbar button{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:5px;padding:10px 8px 12px;border-radius:0;
  border-bottom:1px solid rgba(255,255,255,.1);background:none;color:var(--text-chrome-dim);font-size:11px;letter-spacing:2.5px;flex:none;transition:color .2s,background .2s}
.srcbar button i{font-style:normal;font-size:9px;letter-spacing:1px;opacity:.55}
.srcbar button::after{content:'';position:absolute;left:0;bottom:-1px;height:2px;width:0;background:var(--led);box-shadow:0 0 8px var(--led-glow);transition:width .3s ease}
.srcbar button::before{content:'';position:absolute;top:9px;right:8px;width:4px;height:4px;border-radius:50%;background:var(--led);box-shadow:0 0 6px var(--led-glow);opacity:0;transition:opacity .2s}
.srcbar button:hover{color:var(--text-chrome)}
.segmented.srcbar button.active{background:linear-gradient(180deg,transparent,rgba(45,253,245,.07));color:var(--led);box-shadow:none}
.srcbar button.active::after{width:100%}
.srcbar button.active::before{opacity:1}
.srcbar button.active i{opacity:1}
#optionsField .opt-group[data-for]{padding:10px 0 10px 14px;border-left:1px solid rgba(45,253,245,.45);background:linear-gradient(90deg,rgba(45,253,245,.05),transparent 60%)}
#optionsField .opt-group[data-for]::before{content:'// ' attr(data-for) ' config';flex-basis:100%;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--text-chrome-dim)}
#optionsField input.txt,#optionsField input.dt{border:none;border-bottom:1px solid rgba(45,253,245,.35);border-radius:0;background:transparent}
#optionsField .mini-btn{border-radius:0}
#optionsField .segmented{padding:0;gap:0;background:none;border:none}
#optionsField .segmented button{border:1px solid rgba(255,255,255,.14);border-radius:0;margin-left:-1px;flex:none}
#optionsField .segmented button.active{border-color:var(--led);box-shadow:none;background:rgba(45,253,245,.08);position:relative;z-index:1}
/* start screen (tap to start display) */
.start-screen{position:fixed;inset:0;z-index:10000;display:flex;align-items:center;justify-content:center;background:var(--bg-void);padding:20px;text-align:center}
.start-card{display:flex;flex-direction:column;gap:18px;align-items:center}
.start-title{font-family:'VT323',var(--mono);font-size:28px;letter-spacing:4px;color:var(--led);text-shadow:0 0 14px var(--led-glow)}
.start-sub{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--text-chrome-dim)}
.start-card button{font-size:14px;padding:16px 26px}

@media (max-width:520px){
  .wrap{padding:18px 14px 40px}header.top{margin-bottom:16px}.sign-stage{padding:22px 6px 30px}.sign-line{font-size:26px}
  .field{grid-template-columns:1fr;gap:8px}.panel{padding:18px 16px}input#msgInput{font-size:16px}
  .swatch,.wheel-toggle{width:34px;height:34px}input[type=color]#customColor{width:34px;height:34px}
  .segmented{width:100%}.segmented button{flex:1;padding:11px 10px;font-size:12px}
  button.dl,button.fullscreen-btn{flex:1 1 auto;padding:13px 14px;font-size:12px}
  .fs-exit{width:46px;height:46px}.color-wheel-panel{padding:14px;gap:16px}.wheel-wrap{width:140px;height:140px;margin:0 auto}
  .fs-controls input[type=range]{width:110px}
}
/* Phone full screen: only the signboard */
@media (pointer:coarse),(max-width:820px){
  .fs-overlay.active .fs-rotor .bezel{width:100%;height:100%;padding:0;border-radius:0;background:none;box-shadow:none!important}
  .fs-overlay.active .fs-rotor .screw{display:none}
  .fs-overlay.active .fs-rotor .glass{height:100%;border-radius:0;box-shadow:none;padding:4vh;display:flex;align-items:center;justify-content:center}
  .fs-overlay.landscape-native.active .fs-rotor .glass{padding:4vw}
  .fs-overlay.active .fs-exit,.fs-overlay.active .fs-hint{display:none}
}
/* PC full screen: no rotation, sign fills the screen */
.fs-overlay.active.pc-mode .fs-rotor .bezel{width:100%;height:100%;padding:2vmin;border-radius:0}
.fs-overlay.active.pc-mode .fs-rotor .glass{height:100%;padding:4vmin;border-radius:1vmin;display:flex;align-items:center;justify-content:center}
/* Full screen frame: thin line + corner brackets (keep LAST so it overrides the rules above) */
.fs-overlay.active .fs-rotor .glass{border:.25vmin solid var(--led-dim);box-shadow:0 0 2vmin var(--led-glow),inset 0 0 2vmin var(--led-glow)}
.fs-hud{position:absolute;inset:1vmin;z-index:3;pointer-events:none}
.fs-hud i{position:absolute;width:3.2vmin;height:3.2vmin;border:0 solid var(--led);filter:drop-shadow(0 0 .6vmin var(--led-glow))}
.fs-hud i:nth-child(1){top:0;left:0;border-top-width:.35vmin;border-left-width:.35vmin}
.fs-hud i:nth-child(2){top:0;right:0;border-top-width:.35vmin;border-right-width:.35vmin}
.fs-hud i:nth-child(3){bottom:0;left:0;border-bottom-width:.35vmin;border-left-width:.35vmin}
.fs-hud i:nth-child(4){bottom:0;right:0;border-bottom-width:.35vmin;border-right-width:.35vmin}
.fs-hud b{position:absolute;top:.2vmin;left:4.6vmin;font:400 1.5vmin var(--mono);letter-spacing:.35vmin;text-transform:uppercase;color:var(--led);opacity:.55}
.fs-controls{border-radius:0;background:rgba(5,7,10,.92);border:1px solid var(--led-dim);gap:10px;padding:8px 12px;box-shadow:0 0 18px var(--led-glow)}
.fs-controls::before{content:'// size';font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--text-chrome-dim)}
.fs-controls button{border-radius:0;border-color:rgba(255,255,255,.18);font-size:12px;letter-spacing:1px}
.fs-controls input[type=range]{height:1px;background:rgba(45,253,245,.4)}
.fs-controls input[type=range]::-webkit-slider-thumb{border-radius:0;width:7px;height:18px;margin-top:-9px}
.fs-controls input[type=range]::-moz-range-thumb{border-radius:0;width:7px;height:18px}
.fs-exit{border-radius:0}
.start-card{padding:34px 40px;border:1px solid rgba(45,253,245,.25);position:relative}
.start-card::before,.start-card::after{content:'';position:absolute;width:14px;height:14px;border:0 solid var(--led)}
.start-card::before{top:-1px;left:-1px;border-top-width:2px;border-left-width:2px}
.start-card::after{bottom:-1px;right:-1px;border-bottom-width:2px;border-right-width:2px}
.start-card button{border-radius:0;letter-spacing:4px}
/* Reactor full screen style */
.reactor[hidden]{display:none}
.fs-overlay.reactor-on .fs-rotor .bezel{display:none}
.reactor{position:relative;width:90vmin;height:90vmin;flex:none}
.reactor::before{content:'';position:absolute;inset:7%;border-radius:50%;box-shadow:0 0 9vmin var(--led-glow);opacity:.55}
.rsvg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.rsvg .rl{fill:none;stroke:var(--led);stroke-width:.8;opacity:.7}
.rsvg .tk{stroke:rgba(255,255,255,.16);stroke-width:1.6}
.rsvg .tk.on{stroke:var(--led)}
.rsvg .cell{fill:var(--led);opacity:.1;transition:opacity .4s}
.rsvg .cell.on{opacity:.8}
.rsvg .cell.hd{opacity:1;animation:cellp 1s ease-in-out infinite}
@keyframes cellp{50%{opacity:.45}}
.rsvg .spin{fill:none;stroke:var(--led);stroke-width:1.2;stroke-dasharray:1.5 9;opacity:.5;transform-box:fill-box;transform-origin:center;animation:rspin 90s linear infinite}
@keyframes rspin{to{transform:rotate(360deg)}}
.rcenter{position:absolute;left:24%;top:24%;width:52%;height:52%;border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center}
.rcenter::after{content:'';position:absolute;inset:0;pointer-events:none;mix-blend-mode:multiply;background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0,rgba(0,0,0,.28) 1px,transparent 1px,transparent 3px)}
.rcenter .marquee-track{width:100%}
.fs-overlay.reactor-on .fs-rotor .sign-line{font-size:calc(7.6vmin*var(--fs-scale,1));letter-spacing:.6vmin;line-height:1.25}
.fs-overlay.reactor-on .fs-rotor .sign-lines{gap:.6vmin}
.rtile{position:absolute;z-index:2;width:24%;padding:1vmin 1.2vmin;text-align:center;color:var(--led);background:rgba(4,8,12,.9);border:1px solid var(--led-dim);box-shadow:inset 0 0 1.6vmin var(--led-glow)}
.rtile::before,.rtile::after{content:'';position:absolute;width:1.3vmin;height:1.3vmin;border:0 solid var(--led)}
.rtile::before{top:-1px;left:-1px;border-top-width:2px;border-left-width:2px}
.rtile::after{bottom:-1px;right:-1px;border-bottom-width:2px;border-right-width:2px}
.rtile small{display:block;font:400 1.25vmin var(--mono);letter-spacing:.3vmin;text-transform:uppercase;color:var(--text-chrome-dim)}
.rtile b{display:block;font-family:var(--sign-font,'VT323'),var(--mono);font-weight:400;font-size:3.6vmin;line-height:1.2;letter-spacing:.2vmin;text-shadow:0 0 1vmin var(--led-glow);white-space:nowrap}
.rtile b.sm{font-size:2.3vmin}
.t-top{left:50%;top:5%;transform:translateX(-50%)}.t-bottom{left:50%;bottom:5%;transform:translateX(-50%)}
.t-tl{left:1%;top:15%}.t-tr{right:1%;top:15%}.t-bl{left:1%;bottom:15%}.t-br{right:1%;bottom:15%}
@media (prefers-reduced-motion:reduce){.sign-lines{transition:none}.rsvg .spin,.rsvg .cell.hd{animation:none}}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <span class="dot"></span>
      <div><h1>NANOFON SIGN SHOP</h1><div class="sub">pixel matrix sign maker</div></div>
    </div>
    <div class="meta">unit&nbsp;07 &middot; on air</div>
  </header>

  <div class="sign-stage">
    <div class="bezel" id="bezel">
      <div class="screw tl"></div><div class="screw tr"></div><div class="screw bl"></div><div class="screw br"></div>
      <div class="glass"><div class="marquee-track"><div class="sign-lines" id="signLines"></div></div></div>
    </div>
  </div>

  <div class="panel">
    <div class="field">
      <label for="msgInput">Message</label>
      <input type="text" id="msgInput" maxlength="60" spellcheck="false" autocomplete="off" value="HELLO WORLD">
    </div>

    <div class="field">
      <label>Source</label>
      <div class="segmented srcbar" id="sourceSeg">
        <button data-source="text" class="active"><i>01</i>Text</button>
        <button data-source="clock"><i>02</i>Clock</button>
        <button data-source="date"><i>03</i>Date</button>
        <button data-source="weather"><i>04</i>Weather</button>
        <button data-source="countdown"><i>05</i>Countdown</button>
      </div>
    </div>

    <div class="field" id="optionsField" hidden>
      <label>Options</label>
      <div>
        <div class="opt-group" data-for="clock" hidden>
          <div class="segmented" id="hourSeg"><button data-h="24" class="active">24H</button><button data-h="12">12H</button></div>
          <label class="check"><input type="checkbox" id="secToggle" checked> Seconds</label>
        </div>
        <div class="opt-group" data-for="weather" hidden>
          <input type="text" class="txt" id="cityInput" value="Tokyo" placeholder="City" spellcheck="false" autocomplete="off">
          <button type="button" class="mini-btn" id="cityGo">Go</button>
          <button type="button" class="mini-btn" id="geoBtn">My location</button>
          <div class="segmented" id="unitSeg"><button data-u="C" class="active">°C</button><button data-u="F">°F</button></div>
        </div>
        <div class="opt-group" data-for="countdown" hidden>
          <input type="text" class="txt" id="cdLabel" value="NEW YEAR" maxlength="20" placeholder="Label" spellcheck="false" autocomplete="off">
          <input type="datetime-local" class="dt" id="cdTarget">
        </div>
      </div>
    </div>

    <div class="field">
      <label for="fontSelect">Font</label>
      <select id="fontSelect"></select>
    </div>

    <div class="field">
      <label>Color</label>
      <div>
        <div class="color-controls">
          <div class="swatches" id="swatches">
            <button class="swatch active" data-color="#2dfdf5" style="background:#2dfdf5" title="Cyan"></button>
            <button class="swatch" data-color="#ffb000" style="background:#ffb000" title="Amber"></button>
            <button class="swatch" data-color="#ff3b3b" style="background:#ff3b3b" title="Red"></button>
            <button class="swatch" data-color="#39ff6a" style="background:#39ff6a" title="Green"></button>
            <button class="swatch" data-color="#f5f5f5" style="background:#f5f5f5" title="White"></button>
            <input type="color" id="customColor" value="#2dfdf5" title="Custom">
          </div>
          <button type="button" class="wheel-toggle" id="wheelToggle" title="Color wheel" aria-label="Open color wheel"></button>
        </div>
        <div class="color-wheel-panel" id="colorWheelPanel" hidden>
          <button type="button" class="wheel-close" id="wheelClose" aria-label="Close color wheel">✕</button>
          <div class="wheel-wrap"><canvas id="colorWheel" width="160" height="160"></canvas><div class="wheel-cursor" id="wheelCursor"></div></div>
          <div class="wheel-side">
            <div><div class="wheel-label">Brightness</div><input type="range" id="valueRange" min="0" max="100" value="100"></div>
            <div><div class="wheel-label">Hex</div><input type="text" id="hexInput" maxlength="7" value="#2DFDF5" spellcheck="false" autocomplete="off"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="field">
      <label>Mode</label>
      <div class="segmented" id="modeSeg">
        <button data-mode="static" class="active">Static</button>
        <button data-mode="scroll">Scroll</button>
        <button data-mode="blink">Blink</button>
        <button data-mode="pulse">Pulse</button>
        <button data-mode="flicker">Flicker</button>
        <button data-mode="typewriter">Typewriter</button>
        <button data-mode="neon">Neo Sign</button>
      </div>
    </div>

    <div class="field" id="speedField"><label>Speed</label><input type="range" id="speedRange" min="4" max="40" value="14"></div>
    <div class="field"><label>Glow</label><input type="range" id="glowRange" min="0" max="100" value="55"></div>

    <div class="field">
      <label>Display</label>
      <div>
        <div class="opt-group">
          <label class="check"><input type="checkbox" id="keepAwake" checked> Keep screen on</label>
          <label class="check"><input type="checkbox" id="antiBurn" checked> Anti burn-in</label>
          <label class="check"><input type="checkbox" id="autoStart"> Start screen on open</label>
        </div>
        <div class="opt-group">
          <span class="wheel-label">Night dim</span>
          <input type="range" id="dimRange" min="15" max="100" value="100" style="flex:1 1 140px;width:auto">
          <button type="button" class="mini-btn" id="linkBtn">Copy display link</button>
        </div>
        <div class="opt-group" style="margin-top:10px">
          <span class="wheel-label">Full screen</span>
          <div class="segmented" id="styleSeg"><button data-style="reactor" class="active">Reactor</button><button data-style="sign">Classic</button></div>
        </div>
        <div class="wheel-label" id="wakeNote" style="margin-top:8px"></div>
      </div>
    </div>

    <div class="actions">
      <button class="fullscreen-btn" id="fullscreenBtn">⛶ Full Screen</button>
      <button class="dl" id="downloadBtn">Download PNG</button>
    </div>
  </div>

  <footer>preview build &middot; weather shows sample data here</footer>
</div>

<div class="fs-overlay" id="fsOverlay">
  <button class="fs-exit" id="fsExit" aria-label="Exit full screen">✕</button>
  <div class="fs-rotor" id="fsRotor">
    <div class="reactor" id="reactor" hidden>
      <svg class="rsvg" id="rsvg" viewBox="0 0 400 400" aria-hidden="true"></svg>
      <div class="rcenter" id="rcenter"></div>
      <div class="rtile t-top"><small>Date</small><b id="tDate">--</b></div>
      <div class="rtile t-tl"><small>Sky</small><b class="sm" id="tSky">--</b></div>
      <div class="rtile t-tr"><small>Temp</small><b id="tTemp">--</b></div>
      <div class="rtile t-bl"><small>Zone</small><b id="tZone">--</b></div>
      <div class="rtile t-br"><small id="tCountL">Count</small><b id="tCount">--</b></div>
      <div class="rtile t-bottom"><small id="tBatL">Battery</small><b id="tBat">--</b></div>
    </div>
    <div class="fs-hud"><i></i><i></i><i></i><i></i><b id="hudTag"></b></div>
    <div class="fs-controls" id="fsControls">
      <button type="button" id="fsSmaller" aria-label="Smaller text">A−</button>
      <input type="range" id="fsSize" min="30" max="300" value="100" aria-label="Text size">
      <button type="button" id="fsBigger" aria-label="Bigger text">A+</button>
      <button type="button" id="fsStyleBtn" aria-label="Switch full screen style">UI</button>
      <button type="button" id="fsClose" aria-label="Exit full screen">✕</button>
    </div>
  </div>
  <div class="fs-hint">tap to show controls</div>
</div>

<div class="start-screen" id="startScreen" hidden>
  <div class="start-card">
    <div class="start-title">NANOFON</div>
    <button type="button" class="fullscreen-btn" id="startBtn">▶ Tap to start display</button>
    <div class="start-sub">// standby · full screen · screen stays on</div>
  </div>
</div>

<script>
(function(){
  // To add a font: upload it to ./fount/ on GitHub, then add one line here.
  const FONT_LIBRARY = [
    { value: 'VT323', label: 'LED Pixel (default)', builtin: true },
    { value: 'Moby Bold', file: 'Moby-Bold.ttf' },
    { value: 'Hyperloop', file: 'HYPERLOOP.otf' },
    { value: 'Vultron Bold', file: 'Vultron Bold.otf' },
    { value: 'Wicked Mouse', file: 'Wicked Mouse.otf' },
    { value: 'Whimsy', label: 'Whimsy Script', file: 'Whimsy.ttf' },
    { value: 'Los Santos', file: 'Los Santos.ttf' },
    { value: 'WesternGrit', label: 'Western Grit', file: 'WesternGrit-Regular.ttf' },
    { value: 'BergenSans', file: 'BergenSans-Regular.otf' },
    { value: 'Poppins', file: 'Poppins-Regular.ttf' },
    { value: 'Austral-Sans_Maplines-Regular', file: 'Austral-Sans_Maplines-Regular.ttf' },
    { value: 'BouldenShadow', file: 'BouldenShadow.otf' },
    { value: 'Bouquet Typeface', file: 'Bouquet Typeface.otf' },
    { value: 'Carosello-Regular', file: 'Carosello-Regular.otf' },
    { value: 'EXTRADIONARY - V1', file: 'EXTRADIONARY - V1.ttf' },
    { value: 'FakeEmpire-Regular', file: 'FakeEmpire-Regular.otf' },
    { value: 'FukuCatch @Detetiive', file: 'FukuCatch @Detetiive.otf' },
    { value: 'Ganosgoco', file: 'Ganosgoco.otf' },
    { value: 'GhanesFont', file: 'GhanesFont.ttf' },
    { value: 'Annone-rxOB', file: 'Annone-rxOB.ttf' },
    { value: 'LeOsler_Rough-Border-Regular', file: 'LeOsler_Rough-Border-Regular.ttf' },
    { value: 'LeOsler_Rough-Icon-Regular', file: 'LeOsler_Rough-Icon-Regular.otf' },
    { value: 'Loomattic', file: 'Loomattic.otf' },
    { value: 'Organo', file: 'Organo.ttf' },
    { value: 'Paladise Script', file: 'Paladise Script.otf' },
    { value: 'youre gone', file: 'youre gone.otf' }
  ];

  const $ = id => document.getElementById(id);
  const msgInput=$('msgInput'), fontSelect=$('fontSelect'), signLines=$('signLines'), bezel=$('bezel');
  const signStage=document.querySelector('.sign-stage'), swatches=$('swatches'), customColor=$('customColor');
  const modeSeg=$('modeSeg'), speedRange=$('speedRange'), speedField=$('speedField'), glowRange=$('glowRange');
  const downloadBtn=$('downloadBtn'), fullscreenBtn=$('fullscreenBtn');
  const fsOverlay=$('fsOverlay'), fsExit=$('fsExit'), fsRotor=$('fsRotor'), fsControls=$('fsControls');
  const fsSize=$('fsSize'), fsSmaller=$('fsSmaller'), fsBigger=$('fsBigger'), fsClose=$('fsClose');
  const glass=document.querySelector('.sign-stage .glass');
  const wheelToggle=$('wheelToggle'), wheelClose=$('wheelClose'), colorWheelPanel=$('colorWheelPanel');
  const colorWheel=$('colorWheel'), wheelCursor=$('wheelCursor'), valueRange=$('valueRange'), hexInput=$('hexInput');
  const wheelCtx=colorWheel.getContext('2d');
  const sourceSeg=$('sourceSeg'), optionsField=$('optionsField'), hourSeg=$('hourSeg'), secToggle=$('secToggle');
  const cityInput=$('cityInput'), cityGo=$('cityGo'), geoBtn=$('geoBtn'), unitSeg=$('unitSeg');
  const cdLabel=$('cdLabel'), cdTarget=$('cdTarget');
  const keepAwake=$('keepAwake'), antiBurn=$('antiBurn'), autoStart=$('autoStart'), dimRange=$('dimRange');
  const reactor=$('reactor'), rsvg=$('rsvg'), rcenter=$('rcenter'), styleSeg=$('styleSeg'), track=document.querySelector('.sign-stage .marquee-track');
  const hudTag=$('hudTag'), linkBtn=$('linkBtn'), wakeNote=$('wakeNote'), startScreen=$('startScreen'), startBtn=$('startBtn');

  let state = { color:'#2dfdf5', mode:'static', speed:14, glow:55, font:'VT323',
                source:'text', fsStyle:'reactor', clock24:true, showSeconds:true, units:'C' };

  function applyFont(){ document.documentElement.style.setProperty('--sign-font', "'" + state.font + "'"); }

  function initFontLibrary(){
    FONT_LIBRARY.forEach(entry=>{
      const opt=document.createElement('option');
      opt.value=entry.value; opt.textContent=entry.label||entry.value;
      if(entry.builtin) opt.selected=true;
      fontSelect.appendChild(opt);
      if(entry.file && 'FontFace' in window){
        const url='./fount/'+entry.file.split('/').map(encodeURIComponent).join('/');
        const face=new FontFace(entry.value, `url('${url}')`);
        face.load().then(l=>{ document.fonts.add(l); }).catch(()=>{
          opt.textContent=(entry.label||entry.value)+' (file not found)'; opt.disabled=true;
        });
      }
    });
  }

  // ---- Color helpers ----
  function hexToRgb(hex){
    const h=hex.replace('#','');
    const n=parseInt(h.length===3?h.split('').map(c=>c+c).join(''):h,16);
    return {r:(n>>16)&255,g:(n>>8)&255,b:n&255};
  }
  function rgbToHex(r,g,b){ return '#'+[r,g,b].map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join(''); }
  function hsvToRgb(h,s,v){
    h=((h%360)+360)%360; const c=v*s, x=c*(1-Math.abs((h/60)%2-1)), m=v-c; let r=0,g=0,b=0;
    if(h<60){r=c;g=x;} else if(h<120){r=x;g=c;} else if(h<180){g=c;b=x;} else if(h<240){g=x;b=c;} else if(h<300){r=x;b=c;} else {r=c;b=x;}
    return {r:(r+m)*255,g:(g+m)*255,b:(b+m)*255};
  }
  function rgbToHsv(r,g,b){
    r/=255; g/=255; b/=255; const max=Math.max(r,g,b), min=Math.min(r,g,b), d=max-min; let h=0;
    if(d!==0){ if(max===r) h=60*(((g-b)/d)%6); else if(max===g) h=60*((b-r)/d+2); else h=60*((r-g)/d+4); }
    if(h<0) h+=360;
    return {h, s:max===0?0:d/max, v:max};
  }

  // ---- Color wheel ----
  const wheelRadius=colorWheel.width/2; let wheelHue=180, wheelSat=.82;
  function drawWheel(){
    const size=colorWheel.width, cx=size/2, cy=size/2, img=wheelCtx.createImageData(size,size), v=valueRange.value/100;
    for(let y=0;y<size;y++) for(let x=0;x<size;x++){
      const dx=x-cx, dy=y-cy, dist=Math.sqrt(dx*dx+dy*dy), i=(y*size+x)*4;
      if(dist<=wheelRadius){
        const {r,g,b}=hsvToRgb(Math.atan2(dy,dx)*180/Math.PI, Math.min(1,dist/wheelRadius), v);
        img.data[i]=r; img.data[i+1]=g; img.data[i+2]=b; img.data[i+3]=255;
      } else img.data[i+3]=0;
    }
    wheelCtx.putImageData(img,0,0);
  }
  function positionWheelCursor(){
    const size=colorWheel.width, rad=wheelHue*Math.PI/180, d=wheelSat*wheelRadius;
    wheelCursor.style.left=((size/2+Math.cos(rad)*d)/size*100)+'%';
    wheelCursor.style.top=((size/2+Math.sin(rad)*d)/size*100)+'%';
  }
  function setColorFromWheel(){ const {r,g,b}=hsvToRgb(wheelHue,wheelSat,valueRange.value/100); setColor(rgbToHex(r,g,b),'wheel'); }
  function syncWheelFromColor(hex){
    const {r,g,b}=hexToRgb(hex), {h,s,v}=rgbToHsv(r,g,b);
    wheelHue=h; wheelSat=s; valueRange.value=Math.round(v*100);
    drawWheel(); positionWheelCursor(); hexInput.value=hex.toUpperCase();
  }
  function setColor(hex, source){
    state.color=hex; customColor.value=hex;
    swatches.querySelectorAll('.swatch').forEach(b=>b.classList.toggle('active', b.dataset.color.toLowerCase()===hex.toLowerCase()));
    if(source!=='wheel') syncWheelFromColor(hex); else hexInput.value=hex.toUpperCase();
    applyColor();
  }
  function handleWheelPointer(e){
    const rect=colorWheel.getBoundingClientRect(), k=colorWheel.width/rect.width;
    const dx=(e.clientX-rect.left)*k-colorWheel.width/2, dy=(e.clientY-rect.top)*k-colorWheel.height/2;
    wheelHue=Math.atan2(dy,dx)*180/Math.PI; wheelSat=Math.min(wheelRadius,Math.sqrt(dx*dx+dy*dy))/wheelRadius;
    positionWheelCursor(); setColorFromWheel();
  }
  let wheelDragging=false;
  colorWheel.addEventListener('pointerdown',e=>{ wheelDragging=true; colorWheel.setPointerCapture(e.pointerId); handleWheelPointer(e); });
  colorWheel.addEventListener('pointermove',e=>{ if(wheelDragging) handleWheelPointer(e); });
  colorWheel.addEventListener('pointerup',()=>{ wheelDragging=false; });
  colorWheel.addEventListener('pointercancel',()=>{ wheelDragging=false; });
  valueRange.addEventListener('input',()=>{ drawWheel(); setColorFromWheel(); });
  hexInput.addEventListener('change',()=>{
    let v=hexInput.value.trim(); if(!v.startsWith('#')) v='#'+v;
    if(/^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$/.test(v)){
      if(v.length===4) v='#'+v[1]+v[1]+v[2]+v[2]+v[3]+v[3];
      setColor(v.toLowerCase());
    } else hexInput.value=state.color.toUpperCase();
  });
  wheelToggle.addEventListener('click',()=>{
    const opening=colorWheelPanel.hidden; colorWheelPanel.hidden=!opening; wheelToggle.classList.toggle('active',opening);
    if(opening){ drawWheel(); positionWheelCursor(); }
  });
  wheelClose.addEventListener('click',()=>{ colorWheelPanel.hidden=true; wheelToggle.classList.remove('active'); });

  function applyColor(){
    const {r,g,b}=hexToRgb(state.color), a=state.glow/100, root=document.documentElement;
    root.style.setProperty('--led',state.color);
    root.style.setProperty('--led-glow',`rgba(${r},${g},${b},${(.15+a*.65).toFixed(2)})`);
    root.style.setProperty('--led-dim',`rgba(${r},${g},${b},.5)`);
    bezel.style.boxShadow=`0 1px 0 rgba(255,255,255,.06) inset, 0 -2px 6px rgba(0,0,0,.6) inset, 0 18px 40px rgba(0,0,0,.55), 0 0 ${40+a*70}px rgba(${r},${g},${b},${(.15+a*.4).toFixed(2)})`;
  }

  // ---- Live sources: clock / date / weather / countdown ----
  const DAYS=['SUN','MON','TUE','WED','THU','FRI','SAT'];
  const MONTHS=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  const pad=n=>String(n).padStart(2,'0');
  function weatherWord(c){
    if(c===0) return 'CLEAR'; if(c===1) return 'MOSTLY CLEAR'; if(c===2) return 'PARTLY CLOUDY'; if(c===3) return 'CLOUDY';
    if(c===45||c===48) return 'FOG'; if(c>=51&&c<=55) return 'DRIZZLE'; if(c===56||c===57) return 'FREEZING DRIZZLE';
    if(c===61||c===63) return 'RAIN'; if(c===65) return 'HEAVY RAIN'; if(c===66||c===67) return 'FREEZING RAIN';
    if(c===71||c===73) return 'SNOW'; if(c===75||c===77) return 'HEAVY SNOW'; if(c>=80&&c<=82) return 'SHOWERS';
    if(c===85||c===86) return 'SNOW SHOWERS'; if(c===95) return 'THUNDERSTORM'; if(c===96||c===99) return 'HAIL STORM';
    return 'WEATHER';
  }
  let weatherPlace=null, weatherLines=['LOADING...'], wxInfo=null;
  async function geocode(name){
    const r=await fetch('https://geocoding-api.open-meteo.com/v1/search?count=1&name='+encodeURIComponent(name));
    const j=await r.json();
    if(!j.results||!j.results.length) throw new Error('city not found');
    const p=j.results[0]; return {lat:p.latitude, lon:p.longitude, name:p.name};
  }
  async function loadWeather(){
    try{
      if(!weatherPlace) weatherPlace=await geocode(cityInput.value.trim()||'Tokyo');
      const unit=state.units==='F'?'&temperature_unit=fahrenheit':'';
      const r=await fetch('https://api.open-meteo.com/v1/forecast?latitude='+weatherPlace.lat+'&longitude='+weatherPlace.lon+'&current=temperature_2m,weather_code'+unit);
      const j=await r.json();
      weatherLines=[weatherPlace.name.toUpperCase(), Math.round(j.current.temperature_2m)+'°'+state.units, weatherWord(j.current.weather_code)];
      wxInfo={t:Math.round(j.current.temperature_2m), u:state.units, w:weatherWord(j.current.weather_code)};
    }catch(err){
      weatherLines = [(cityInput.value.trim()||'Tokyo').toUpperCase(), (state.units==='F'?'75':'24')+'\u00b0'+state.units, 'PARTLY CLOUDY'];
      weatherPlace=null;
    }
    updateLive();
  }
  function countdownLines(){
    const label=(cdLabel.value.trim()||'COUNTDOWN').toUpperCase();
    if(!cdTarget.value) return [label,'SET A DATE'];
    const diff=new Date(cdTarget.value).getTime()-Date.now();
    if(diff<=0) return [label,'TIME UP'];
    const s=Math.floor(diff/1000), d=Math.floor(s/86400), h=Math.floor((s%86400)/3600), m=Math.floor((s%3600)/60);
    return [label,(d>0?d+'D ':'')+pad(h)+':'+pad(m)+':'+pad(s%60)];
  }
  function getLines(){
    const now=new Date();
    switch(state.source){
      case 'clock':{
        let h=now.getHours(), suf='';
        if(!state.clock24){ suf=h>=12?' PM':' AM'; h=h%12||12; }
        return [(state.clock24?pad(h):String(h))+':'+pad(now.getMinutes())+(state.showSeconds?':'+pad(now.getSeconds()):'')+suf];
      }
      case 'date': return [DAYS[now.getDay()], MONTHS[now.getMonth()]+' '+now.getDate()];
      case 'weather': return weatherLines;
      case 'countdown': return countdownLines();
      default: return msgInput.value.split('\n').slice(0,4);
    }
  }
  const NB='\u00a0';
  function lineText(l){ const t=l.length?l:NB; return state.mode==='scroll'?(t+NB.repeat(5)).repeat(2):t; }
  // Update text in place once per second so animations don't restart
  function updateLive(){
    if(state.source==='text') return;
    const lines=getLines(), divs=signLines.children;
    if(divs.length!==lines.length){ render(); return; }
    lines.forEach((l,i)=>{
      divs[i].textContent=lineText(l);
      if(state.mode==='neon') divs[i].dataset.text=lines[i].length?lines[i]:NB;
      divs[i].classList.toggle('empty', l.trim()==='');
    });
  }
  setInterval(updateLive,1000);
  setInterval(()=>{ if(state.source==='weather'||reactor.hidden===false) loadWeather(); }, 5*60*1000);   // weather refresh: every 5 min

  // ---- Typewriter (Text source only) ----
  let typewriterTimer=null;
  function clearTypewriter(){ if(typewriterTimer){ clearInterval(typewriterTimer); clearTimeout(typewriterTimer); typewriterTimer=null; } }
  function startTypewriter(lines){
    const divs=lines.map(line=>{
      const div=document.createElement('div');
      div.className='sign-line'+(line.trim()===''?' empty':'');
      if(!line.length) div.textContent=NB;
      else{
        const shown=document.createElement('span'), hidden=document.createElement('span');
        hidden.className='not-typed'; hidden.textContent=line; div.appendChild(shown); div.appendChild(hidden);
      }
      signLines.appendChild(div); return div;
    });
    const maxLen=Math.max(1,...lines.map(l=>l.length)), stepDelay=Math.max(35,300-state.speed*8); let i=0;
    function tick(){
      divs.forEach((div,idx)=>{
        const line=lines[idx]; if(!line.length) return;
        div.children[0].classList.remove('caret'); div.children[0].textContent=line.slice(0,i); div.children[1].textContent=line.slice(i);
      });
      if(divs.length&&divs[divs.length-1].children[0]) divs[divs.length-1].children[0].classList.add('caret');
      i++;
      if(i>maxLen){ clearTypewriter(); typewriterTimer=setTimeout(()=>{ i=0; typewriterTimer=setInterval(tick,stepDelay); },1100); }
    }
    typewriterTimer=setInterval(tick,stepDelay);
  }

  function render(){
    const lines=getLines();
    clearTypewriter(); signLines.innerHTML='';
    signLines.classList.toggle('scrolling',state.mode==='scroll');
    signLines.classList.toggle('blinking',state.mode==='blink');
    signLines.classList.toggle('pulsing',state.mode==='pulse');
    signLines.classList.toggle('flickering',state.mode==='flicker');
    signLines.classList.toggle('neon-mode',state.mode==='neon');
    glass.classList.toggle('neon-active',state.mode==='neon');
    if(state.mode==='typewriter'&&state.source==='text') startTypewriter(lines);
    else lines.forEach(line=>{
      const div=document.createElement('div');
      div.className='sign-line'+(line.trim()===''?' empty':'');
      div.textContent=lineText(line);
      if(state.mode==='scroll') div.style.animationDuration=Math.max(2,44-state.speed)+'s';
      if(state.mode==='neon') div.dataset.text=line.length?line:NB;
      signLines.appendChild(div);
    });
    const speedActive=state.mode==='scroll'||(state.mode==='typewriter'&&state.source==='text');
    speedField.style.opacity=speedActive?'1':'.35'; speedRange.disabled=!speedActive;
    hudTag.textContent='// '+state.source+' · '+state.mode;
  }

  msgInput.addEventListener('input',render);
  swatches.querySelectorAll('.swatch').forEach(b=>b.addEventListener('click',()=>setColor(b.dataset.color)));
  customColor.addEventListener('input',()=>setColor(customColor.value));
  modeSeg.querySelectorAll('button').forEach(btn=>btn.addEventListener('click',()=>{
    modeSeg.querySelectorAll('button').forEach(b=>b.classList.remove('active')); btn.classList.add('active');
    state.mode=btn.dataset.mode; render();
  }));
  speedRange.addEventListener('input',()=>{ state.speed=parseInt(speedRange.value,10); render(); });
  glowRange.addEventListener('input',()=>{ state.glow=parseInt(glowRange.value,10); applyColor(); });
  fontSelect.addEventListener('change',()=>{ state.font=fontSelect.value; applyFont(); });

  downloadBtn.addEventListener('click',()=>{
    const lines=getLines(), scale=4, fontSize=42*scale, padX=60*scale, padY=40*scale;
    const canvas=document.createElement('canvas'), ctx=canvas.getContext('2d');
    ctx.font=fontSize+"px '"+state.font+"'";
    let maxW=0; lines.forEach(l=>{ const w=ctx.measureText(l.length?l:' ').width; if(w>maxW) maxW=w; });
    const lineH=fontSize*1.25;
    canvas.width=Math.max(400,maxW+padX*2); canvas.height=lines.length*lineH+padY*2;
    ctx.fillStyle='#060a0b'; ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.font=fontSize+"px '"+state.font+"'"; ctx.textBaseline='top';
    ctx.fillStyle=state.color; ctx.shadowColor=state.color; ctx.shadowBlur=20+(state.glow/100)*40;
    lines.forEach((l,i)=>ctx.fillText(l.length?l:' ',padX,padY+i*lineH));
    const a=document.createElement('a'); a.download='nanofon-sign.png'; a.href=canvas.toDataURL('image/png'); a.click();
  });

  // ---- Source selector and options ----
  function showOptions(){
    let any=false;
    optionsField.querySelectorAll('.opt-group').forEach(g=>{ const on=g.dataset.for===state.source; g.hidden=!on; if(on) any=true; });
    optionsField.hidden=!any;
    msgInput.closest('.field').style.opacity=state.source==='text'?'1':'.35';
  }
  sourceSeg.querySelectorAll('button').forEach(btn=>btn.addEventListener('click',()=>{
    sourceSeg.querySelectorAll('button').forEach(b=>b.classList.remove('active')); btn.classList.add('active');
    state.source=btn.dataset.source; showOptions();
    if(state.source==='weather') loadWeather();
    render();
  }));
  hourSeg.querySelectorAll('button').forEach(btn=>btn.addEventListener('click',()=>{
    hourSeg.querySelectorAll('button').forEach(b=>b.classList.remove('active')); btn.classList.add('active');
    state.clock24=btn.dataset.h==='24'; render();
  }));
  secToggle.addEventListener('change',()=>{ state.showSeconds=secToggle.checked; render(); });
  unitSeg.querySelectorAll('button').forEach(btn=>btn.addEventListener('click',()=>{
    unitSeg.querySelectorAll('button').forEach(b=>b.classList.remove('active')); btn.classList.add('active');
    state.units=btn.dataset.u; if(state.source==='weather') loadWeather();
  }));
  function searchCity(){ weatherPlace=null; weatherLines=['LOADING...']; render(); loadWeather(); }
  cityGo.addEventListener('click',searchCity);
  cityInput.addEventListener('keydown',e=>{ if(e.key==='Enter') searchCity(); });
  geoBtn.addEventListener('click',()=>{
    if(!navigator.geolocation){ weatherLines=['NO GPS']; render(); return; }
    weatherLines=['LOCATING...']; render();
    navigator.geolocation.getCurrentPosition(
      p=>{ weatherPlace={lat:p.coords.latitude, lon:p.coords.longitude, name:'My location'}; loadWeather(); },
      ()=>{ weatherLines=['LOCATION','DENIED']; render(); });
  });
  cdLabel.addEventListener('input',render);
  cdTarget.addEventListener('input',render);

  // ---- Full screen ----
  function updateOrientationClass(){
    const ua=navigator.userAgent||'';
    const phone=/Android|iPhone|iPad|iPod|Mobile/i.test(ua)||(/Macintosh/.test(ua)&&navigator.maxTouchPoints>1);
    const landscape=window.matchMedia('(orientation: landscape)').matches;
    fsOverlay.classList.toggle('landscape-native',!phone||landscape);
    fsOverlay.classList.toggle('pc-mode',!phone);
  }
  let controlsTimer=null, idleTimer=null;
  function showControls(){ fsControls.classList.add('show'); clearTimeout(controlsTimer); controlsTimer=setTimeout(()=>fsControls.classList.remove('show'),4000); }
  function hideControls(){ clearTimeout(controlsTimer); fsControls.classList.remove('show'); }
  function setFsScale(p){ p=Math.max(30,Math.min(300,p)); fsSize.value=p; fsOverlay.style.setProperty('--fs-scale',p/100); }
  function wakeCursor(){ fsOverlay.classList.remove('idle'); clearTimeout(idleTimer); idleTimer=setTimeout(()=>fsOverlay.classList.add('idle'),3000); }

  // Keep the screen awake while in full screen (Screen Wake Lock API)
  let wakeLock=null;
  async function lockScreen(){
    if(!keepAwake.checked||!('wakeLock' in navigator)) return;
    try{ wakeLock=await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release',()=>{ wakeLock=null; }); }catch(e){}
  }
  function unlockScreen(){ if(wakeLock){ wakeLock.release().catch(()=>{}); wakeLock=null; } }
  document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'&&fsOverlay.classList.contains('active')) lockScreen(); });
  wakeNote.textContent='wakeLock' in navigator ? 'Screen stays on while in full screen' : 'Wake lock not supported here: set the device auto-lock to Never';

  function enterFullscreen(){
    fsRotor.appendChild(bezel); fsOverlay.classList.add('active'); document.body.style.overflow='hidden';
    updateOrientationClass(); wakeCursor(); lockScreen();
    applyFsStyle(); if(state.fsStyle==='reactor'&&!wxInfo) loadWeather();
    try{
      const req=fsOverlay.requestFullscreen||fsOverlay.webkitRequestFullscreen;
      if(req){
        const p=req.call(fsOverlay);
        const tryLock=()=>{ if(screen.orientation&&screen.orientation.lock) screen.orientation.lock('landscape').catch(()=>{}); };
        if(p&&p.then) p.then(tryLock).catch(()=>{}); else tryLock();
      }
    }catch(err){}
  }
  function exitFullscreen(){
    hideControls(); unlockScreen(); clearTimeout(idleTimer);
    signStage.appendChild(bezel); fsOverlay.classList.remove('active'); applyFsStyle(); document.body.style.overflow='';
    try{ if(screen.orientation&&screen.orientation.unlock) screen.orientation.unlock(); }catch(err){}
    try{
      if(document.fullscreenElement||document.webkitFullscreenElement){
        const ex=document.exitFullscreen||document.webkitExitFullscreen;
        if(ex){ const p=ex.call(document); if(p&&p.catch) p.catch(()=>{}); }
      }
    }catch(err){}
  }
  window.addEventListener('resize',()=>{ if(fsOverlay.classList.contains('active')) updateOrientationClass(); });
  fullscreenBtn.addEventListener('click',enterFullscreen);
  fsExit.addEventListener('click',e=>{ e.stopPropagation(); exitFullscreen(); });
  fsOverlay.addEventListener('click',()=>{ fsControls.classList.contains('show')?hideControls():showControls(); });
  fsOverlay.addEventListener('pointermove',e=>{ if(e.pointerType==='mouse'&&fsOverlay.classList.contains('active')){ showControls(); wakeCursor(); } });
  fsControls.addEventListener('click',e=>{ e.stopPropagation(); showControls(); });
  fsSize.addEventListener('input',()=>{ setFsScale(parseInt(fsSize.value,10)); showControls(); });
  fsSmaller.addEventListener('click',()=>setFsScale(parseInt(fsSize.value,10)-10));
  fsBigger.addEventListener('click',()=>setFsScale(parseInt(fsSize.value,10)+10));
  fsClose.addEventListener('click',exitFullscreen);
  document.addEventListener('keydown',e=>{
    if(!fsOverlay.classList.contains('active')){
      if((e.key==='f'||e.key==='F')&&!/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) enterFullscreen();
      return;
    }
    if(e.key==='Escape') exitFullscreen();
    else if(e.key==='+'||e.key==='='){ setFsScale(parseInt(fsSize.value,10)+10); showControls(); }
    else if(e.key==='-'){ setFsScale(parseInt(fsSize.value,10)-10); showControls(); }
  });
  document.addEventListener('fullscreenchange',()=>{ if(!document.fullscreenElement&&fsOverlay.classList.contains('active')) exitFullscreen(); });
  document.addEventListener('webkitfullscreenchange',()=>{ if(!document.webkitFullscreenElement&&fsOverlay.classList.contains('active')) exitFullscreen(); });

  // Anti burn-in: nudge the text a few pixels every minute while in full screen
  setInterval(()=>{
    const on=fsOverlay.classList.contains('active')&&antiBurn.checked, r=()=>on?Math.round((Math.random()*2-1)*6)+'px':'0px';
    signLines.style.setProperty('--bx',r()); signLines.style.setProperty('--by',r());
  },60000);
  dimRange.addEventListener('input',()=>fsOverlay.style.setProperty('--fs-bright',dimRange.value/100));


  // ---- Reactor full screen style ----
  const tickEls=[], cellEls=[]; let battery=null;
  if(navigator.getBattery) navigator.getBattery().then(b=>{ battery=b; }).catch(()=>{});
  function buildReactor(){
    const D=Math.PI/180, P=(r,a)=>[(200+r*Math.cos(a)).toFixed(2),(200+r*Math.sin(a)).toFixed(2)];
    const arc=(r1,r2,a0,a1)=>{ const [x1,y1]=P(r2,a0),[x2,y2]=P(r2,a1),[x3,y3]=P(r1,a1),[x4,y4]=P(r1,a0);
      return `M${x1},${y1}A${r2},${r2} 0 0 1 ${x2},${y2}L${x3},${y3}A${r1},${r1} 0 0 0 ${x4},${y4}Z`; };
    let t='', c='';
    for(let i=0;i<60;i++){ const a=(-90+i*6)*D, [x1,y1]=P(i%5===0?163:168,a), [x2,y2]=P(178,a); t+=`<line class="tk" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`; }
    for(let i=0;i<12;i++) c+=`<path class="cell" d="${arc(116,140,(-90+i*30+3)*D,(-90+(i+1)*30-3)*D)}"/>`;
    rsvg.innerHTML=
      '<defs><radialGradient id="rbg" cx="50%" cy="50%" r="50%"><stop offset="60%" stop-color="#0b141b"/><stop offset="100%" stop-color="#05070a"/></radialGradient>'+
      '<linearGradient id="rmetal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6b7b84"/><stop offset=".5" stop-color="#1b2227"/><stop offset="1" stop-color="#55646c"/></linearGradient></defs>'+
      '<circle cx="200" cy="200" r="196" fill="url(#rbg)" stroke="rgba(255,255,255,.08)"/>'+
      '<circle class="rl" cx="200" cy="200" r="190"/><circle class="spin" cx="200" cy="200" r="185"/>'+
      '<g style="filter:drop-shadow(0 0 2px var(--led-glow))">'+t+'</g>'+
      '<circle cx="200" cy="200" r="150" fill="none" stroke="url(#rmetal)" stroke-width="12"/>'+
      '<circle class="rl" cx="200" cy="200" r="157" style="opacity:.35"/><circle class="rl" cx="200" cy="200" r="143" style="opacity:.35"/>'+
      '<g style="filter:drop-shadow(0 0 5px var(--led-glow))">'+c+'</g>'+
      '<circle class="rl" cx="200" cy="200" r="108"/><circle cx="200" cy="200" r="104" fill="#04080b"/>'+
      '<path d="M191,1 L209,1 L200,14Z" fill="#ff3b3b" style="filter:drop-shadow(0 0 4px #ff3b3b)"/>';
    rsvg.querySelectorAll('.tk').forEach(e=>tickEls.push(e));
    rsvg.querySelectorAll('.cell').forEach(e=>cellEls.push(e));
  }
  function updateReactor(){
    if(reactor.hidden) return;
    const now=new Date(), s=now.getSeconds(), n=Math.floor(s/5);
    tickEls.forEach((el,i)=>el.classList.toggle('on',i<=s));
    cellEls.forEach((el,i)=>{ el.classList.toggle('on',i<=n); el.classList.toggle('hd',i===n); });
    $('tDate').textContent=DAYS[now.getDay()]+' '+now.getDate();
    $('tTemp').textContent=wxInfo?wxInfo.t+'°'+wxInfo.u:'--';
    $('tSky').textContent=wxInfo?wxInfo.w:'--';
    const off=-now.getTimezoneOffset()/60; $('tZone').textContent='UTC'+(off>=0?'+':'')+off;
    $('tBat').textContent=battery?Math.round(battery.level*100)+'%':'--';
    $('tBatL').textContent=battery&&battery.charging?'Charging':'Battery';
    $('tCountL').textContent=(cdLabel.value.trim()||'Count').slice(0,10);
    $('tCount').textContent=cdTarget.value?(new Date(cdTarget.value)>now?'D-'+Math.ceil((new Date(cdTarget.value)-now)/864e5):'DONE'):'--';
  }
  function applyFsStyle(){
    const on=fsOverlay.classList.contains('active')&&state.fsStyle==='reactor';
    fsOverlay.classList.toggle('reactor-on',on); reactor.hidden=!on;
    if(on) rcenter.appendChild(track); else if(track.parentNode!==glass) glass.appendChild(track);
    updateReactor();
  }
  setInterval(updateReactor,1000);
  styleSeg.querySelectorAll('button').forEach(btn=>btn.addEventListener('click',()=>{
    styleSeg.querySelectorAll('button').forEach(b=>b.classList.remove('active')); btn.classList.add('active');
    state.fsStyle=btn.dataset.style; applyFsStyle();
    if(state.fsStyle==='reactor'&&fsOverlay.classList.contains('active')&&!wxInfo) loadWeather();
  }));
  $('fsStyleBtn').addEventListener('click',()=>pick(styleSeg,'style',state.fsStyle==='reactor'?'sign':'reactor'));
  buildReactor();

  // ---- Save settings, URL parameters, display link ----
  const KEY='nanofon.v1';
  function snapshot(){
    return { text:msgInput.value, source:state.source, mode:state.mode, color:state.color, glow:String(state.glow), speed:String(state.speed),
      font:state.font, hours:state.clock24?'24':'12', seconds:state.showSeconds?'1':'0', units:state.units, city:cityInput.value,
      label:cdLabel.value, until:cdTarget.value, size:fsSize.value, dim:dimRange.value,
      style:state.fsStyle, keep:keepAwake.checked?'1':'0', burn:antiBurn.checked?'1':'0', auto:autoStart.checked?'1':'0' };
  }
  let saveTimer=null;
  function save(){ clearTimeout(saveTimer); saveTimer=setTimeout(()=>{ try{ localStorage.setItem(KEY,JSON.stringify(snapshot())); }catch(e){} },300); }
  ['input','change','click'].forEach(ev=>document.addEventListener(ev,save,true));

  function pick(seg,attr,val){
    if(val==null||val==='') return;
    const b=[...seg.querySelectorAll('button')].find(x=>x.dataset[attr]===String(val)); if(b) b.click();
  }
  function setRange(el,val){
    if(val==null||val==='') return; const n=Number(val); if(isNaN(n)) return;
    el.value=n; el.dispatchEvent(new Event('input'));
  }
  function applySettings(o){
    if(o.city!=null) cityInput.value=String(o.city).slice(0,40);
    if(o.label!=null) cdLabel.value=String(o.label).slice(0,20);
    if(o.until) cdTarget.value=o.until;
    if(o.text!=null) msgInput.value=String(o.text).slice(0,60);
    if(o.font&&[...fontSelect.options].some(x=>x.value===o.font&&!x.disabled)){ fontSelect.value=o.font; state.font=o.font; applyFont(); }
    if(/^#?[0-9a-f]{6}$/i.test(o.color||'')) setColor('#'+o.color.replace('#','').toLowerCase());
    setRange(glowRange,o.glow); setRange(speedRange,o.speed); setRange(dimRange,o.dim);
    if(o.size!=null&&o.size!==''&&!isNaN(Number(o.size))) setFsScale(Number(o.size));
    if(o.keep!=null) keepAwake.checked=o.keep==='1';
    if(o.burn!=null) antiBurn.checked=o.burn==='1';
    if(o.auto!=null) autoStart.checked=o.auto==='1';
    if(o.seconds!=null){ secToggle.checked=o.seconds==='1'; state.showSeconds=secToggle.checked; }
    pick(hourSeg,'h',o.hours); pick(unitSeg,'u',o.units); pick(styleSeg,'style',o.style); pick(modeSeg,'mode',o.mode); pick(sourceSeg,'source',o.source);
  }
  linkBtn.addEventListener('click',async()=>{
    const p=new URLSearchParams(snapshot()); p.set('display','1');
    const url=location.href.split(/[?#]/)[0]+'?'+p.toString();
    try{ await navigator.clipboard.writeText(url); linkBtn.textContent='Copied!'; setTimeout(()=>{ linkBtn.textContent='Copy display link'; },1800); }
    catch(e){ window.prompt('Copy this display link:',url); }
  });
  startBtn.addEventListener('click',()=>{ startScreen.hidden=true; enterFullscreen(); });

  // ---- Init ----
  applyColor(); initFontLibrary(); applyFont(); render(); syncWheelFromColor(state.color);
  let saved={}; try{ saved=JSON.parse(localStorage.getItem(KEY)||'{}')||{}; }catch(e){}
  const q=new URLSearchParams(location.search), fromUrl={};
  ['text','source','mode','color','glow','speed','font','hours','seconds','units','city','label','until','size','dim','style','keep','burn','auto'].forEach(k=>{ if(q.has(k)) fromUrl[k]=q.get(k); });
  applySettings(Object.assign({},saved,fromUrl));
  if(!cdTarget.value){ const t=new Date(Date.now()+3*864e5); cdTarget.value=new Date(t-t.getTimezoneOffset()*6e4).toISOString().slice(0,16); }
  showOptions(); render();
  if(q.get('display')==='1'||autoStart.checked){ startScreen.hidden=false; startBtn.focus(); }
})();
